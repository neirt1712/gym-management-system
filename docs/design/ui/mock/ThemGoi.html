<form class="modal" role="dialog" aria-modal="true" aria-labelledby="tg-title" style="max-width: 660px">
<div class="modal-head"><h1 id="tg-title" class="h2">Thêm gói</h1><a href="QuanTriGoi.html" class="icon-btn" aria-label="Đóng"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></a></div>
<div class="modal-body">
<label class="field">Tên gói<input class="input" value="Gym + PT 12 buổi"></label>
<fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 8px"><legend class="field" style="padding: 0; margin-bottom: 8px">Loại gói</legend>
<div class="row"><label class="radio-card" style="padding: 12px 16px"><input type="radio" name="loai">Gym tự do</label><label class="radio-card on" style="padding: 12px 16px"><input type="radio" name="loai" checked><b>Có PT</b></label></div></fieldset>
<div class="grid g2" style="gap: 14px"><label class="field">Giá (VND)<input class="input" inputmode="numeric" value="4.200.000"></label><label class="field">Thời hạn<span class="row" style="flex-wrap: nowrap; gap: 8px"><input class="input" type="number" value="3" style="width: 90px"><select class="select"><option>Tháng</option><option>Ngày</option></select></span></label></div>
<div class="grid g2" style="gap: 14px"><label class="field">Số buổi PT<input class="input" type="number" value="12"></label><label class="field">Phút mỗi buổi<input class="input" type="number" value="60"></label></div>
<fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 8px"><legend class="field" style="padding: 0; margin-bottom: 8px">Quyền lợi</legend>
<div class="row" style="flex-wrap: nowrap"><input class="input" aria-label="Quyền lợi 1" value="Ra vào phòng tập không giới hạn"><button type="button" class="icon-btn" aria-label="Xóa quyền lợi 1"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button></div>
<div class="row" style="flex-wrap: nowrap"><input class="input" aria-label="Quyền lợi 2" value="12 buổi với huấn luyện viên"><button type="button" class="icon-btn" aria-label="Xóa quyền lợi 2"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button></div>
<button type="button" class="btn btn-soft btn-sm" style="align-self: flex-start"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg> Thêm quyền lợi</button></fieldset>
<div class="field">Ảnh gói <span class="opt">(hiện ở danh mục và trang chi tiết)</span>
<label class="drop"><img src="" data-anh="cho-cap-nhat" alt="Xem trước ảnh gói (ảnh mẫu)" class="pic sq"><span style="display: flex; flex-direction: column; gap: 4px"><b><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M4 20h16"></path></svg> Kéo ảnh vào đây hoặc bấm để chọn</b><span class="hint">JPEG hoặc PNG, tối đa 2 MB, tỉ lệ 4:3.</span></span><input type="file" accept="image/png,image/jpeg" class="sr"></label>
</div>
<label class="check"><input type="checkbox" checked>Gói này được vào lớp học</label>
<label class="check"><input type="checkbox" checked>Mở bán ngay sau khi lưu</label>
