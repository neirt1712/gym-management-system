<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Tạo tài khoản</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&amp;family=Oswald:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F7F8FA}
a{color:#1B2430}a:hover{color:#1B2430}
</style>
</helmet>
<div class="app" style="display: flex; flex-wrap: wrap">
<section class="dark-zone" style="flex: 1 1 440px; background: var(--night); color: var(--on-dark); padding: 44px; display: flex; flex-direction: column; justify-content: space-between; gap: 40px; min-height: 380px; position: relative; overflow: hidden">
<div class="blob" style="width: 440px; height: 440px; background: var(--sun-2); right: -160px; bottom: -120px; opacity: .45"></div>
<div class="blob" style="width: 260px; height: 260px; background: var(--sun-4); left: -80px; top: 30%; opacity: .3; animation-delay: -4s"></div>
<a href="Main.html" class="brand" style="color: var(--on-dark); position: relative"><span class="brand-mark"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"></path></svg></span>PHÒNG GYM</a>
<div class="enter" style="display: flex; flex-direction: column; gap: 20px; position: relative">
<p class="display" style="margin: 0; font-size: clamp(56px, 7vw, 100px)">Tập đúng.<br><span class="sun-text">Đến đều.</span></p>
<p style="margin: 0; max-width: 440px; font-size: 16px; line-height: 1.6; color: var(--on-dark-2)">Một tài khoản để mua gói, xem số buổi còn lại, đặt lịch với PT và check-in bằng mã QR.</p>
</div>
<div class="float" style="position: relative"><img src="" data-anh="cho-cap-nhat" alt="Ảnh phòng tập (ảnh mẫu)" class="pic" style="height: 190px"></div>
</section>
<main style="flex: 1 1 500px; padding: 64px 48px; display: flex; align-items: center; justify-content: center">
<form class="card enter" style="width: 100%; max-width: 460px; padding: 36px; gap: 18px">
<div style="display: flex; flex-direction: column; gap: 8px"><span class="eyebrow">BƯỚC 1 TRƯỚC KHI MUA GÓI</span><h1 class="h1" style="font-size: 46px">Tạo tài khoản</h1></div>
<label class="field">Họ và tên<input class="input" type="text" value="Trần Văn Bảo"></label>
<label class="field">Số điện thoại<input class="input" type="tel" value="0900000005"><span class="hint">Dùng số này để đăng nhập.</span></label>
<label class="field">Email <span class="opt">(không bắt buộc)</span><input class="input" type="email" placeholder="ban@example.com"><span class="hint">Có email thì tự đặt lại mật khẩu được. Không có thì đặt lại tại quầy.</span></label>
<label class="field">Mật khẩu<input class="input" type="password" value="matkhau123"><span class="hint">Tối thiểu 8 ký tự.</span></label>
<a href="NgayBatDau.html" class="btn btn-primary btn-block" style="min-height: 54px">Tạo tài khoản</a>
<p style="margin: 0; font-size: 14px; color: var(--text-2); text-align: center">Đã có tài khoản? <a href="DangNhap.html" class="link">Đăng nhập</a></p>
</form>
</main>
</div>
</x-dc>
</body>
</html>
