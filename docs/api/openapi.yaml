    get:
      tags: [Tài khoản]
      operationId: getUser
      summary: Xem chi tiết tài khoản
      description: |
        **Quyền:** ADMIN · **UC31**
      responses:
        '200':
          description: Chi tiết tài khoản.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
              examples:
                UserTrainer: { $ref: '#/components/examples/UserTrainer' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Tài khoản]
      operationId: updateUser
      summary: Sửa thông tin tài khoản
