        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: SĐT hoặc email đã được dùng.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                PHONE_DUPLICATED: { $ref: '#/components/examples/ErrPhoneDuplicated' }
                EMAIL_DUPLICATED: { $ref: '#/components/examples/ErrEmailDuplicated' }

  /users/{id}:
    parameters:
