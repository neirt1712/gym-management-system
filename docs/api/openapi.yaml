openapi: 3.1.0

# =============================================================================
# HỢP ĐỒNG API — HỆ THỐNG QUẢN LÝ PHÒNG GYM
# Chủ file: Triển (BE Lead). Đổi gì cũng ghi vào docs/api/CHANGELOG.md và báo Sơn.
# Thứ tự trong file:
#   1. info, servers, tags        — giới thiệu, quy ước chung (đọc trước)
#   2. paths                      — các endpoint, xếp theo nhóm giống docs/spec/api-v3.md
#   3. components                 — schema, tham số, response lỗi, ví dụ dùng chung
# Xem dạng trang web: npx @redocly/cli preview-docs docs/api/openapi.yaml
# =============================================================================

info:
  title: Gym Management API
  version: 0.2.0
  description: |
    Hợp đồng API giữa backend (NestJS) và frontend (React) của hệ thống quản lý phòng gym.

    **Phiên bản 0.2** đủ 16 nhóm, 74 API theo `docs/spec/api-v3.md`, cộng 2 endpoint theo câu hỏi
    đã chốt (Q6 tạo lại QR, Q15 đặt lại mật khẩu tại quầy). Chỗ còn chờ trả lời ghi "Chưa chốt (Qxx)".

    Nguồn phạm vi: `docs/spec/api-v3.md`, `use-cases-v3.md`, `erd-v3.md`, `decisions.md`.
    Mã lỗi: `docs/api/error-codes.md`. Lịch sử thay đổi: `docs/api/CHANGELOG.md`.

    ## Quy ước chung

    | Chủ đề | Quy ước |
    | --- | --- |
    | Đường dẫn gốc | `/api/v1` |
    | Tên field | camelCase (`fullName`, `startsOn`) |
    | Tiền | Số nguyên VND, không có phần lẻ (`price: 500000`) |
    | Ngày thuần | `YYYY-MM-DD`, theo giờ Việt Nam (`startsOn: "2026-10-08"`) |
    | Thời điểm | ISO 8601 có múi giờ `+07:00` (`"2026-10-08T09:30:00+07:00"`) |
    | Mã định danh | UUID |
    | Danh sách | Luôn trả `{ data: [...], meta: { page, pageSize, total, totalPages } }`. Tham số `page` (từ 1), `pageSize` (mặc định 20, tối đa 100) |
    | Field không có giá trị | Trả `null`, không bỏ field |
    | Ngày nghiệp vụ | BE tính sẵn (ngày kết thúc gói, hạn thanh toán…). FE chỉ hiển thị, không tự cộng trừ ngày |

    ## Đăng nhập và phiên

    1. `POST /auth/login` trả `accessToken` (hạn 15 phút) trong body và đặt cookie
       `refresh_token` (HttpOnly, SameSite=Lax, path `/api/v1/auth`).
    2. FE giữ `accessToken` trong bộ nhớ, gửi kèm mọi request:
       `Authorization: Bearer <accessToken>`.
    3. Gặp `401 UNAUTHENTICATED`: FE gọi `POST /auth/refresh` một lần (trình duyệt tự gửi cookie),
       nhận token mới rồi gửi lại request. Refresh lỗi thì về trang đăng nhập.
    4. Khóa tài khoản hoặc đổi mật khẩu sẽ làm mọi phiên cũ hết hiệu lực (`users.token_version`).

    ## Vai trò

    `ADMIN` (quản trị), `STAFF` (nhân viên quầy), `TRAINER` (PT), `MEMBER` (khách hàng/hội viên).
    Mỗi endpoint ghi rõ ở dòng **Quyền**. "Của mình" nghĩa là BE kiểm tra quyền sở hữu trên mọi
    `{id}`: gọi vào dữ liệu của người khác nhận `404 NOT_FOUND` (không tiết lộ là có tồn tại).

    ## Lỗi

    Mọi lỗi có cùng dạng:

    ```json
    { "error": { "code": "PHONE_DUPLICATED", "message": "...", "details": null, "requestId": "..." } }
    ```

    - FE xử lý theo `error.code`, **không** dựa vào `message` (message chỉ cho dev đọc).
    - Câu hiển thị cho người dùng lấy từ cột "Thông điệp FE" trong `docs/api/error-codes.md`.
    - `VALIDATION_ERROR` có `details` là danh sách `{ field, messages }` để tô đỏ ô nhập.
    - Mỗi response (cả thành công) có header `X-Request-Id`, trùng với `error.requestId`.

    ## Cách đọc mỗi endpoint

    Mô tả mỗi endpoint mở đầu bằng **Quyền** và **UC**, sau đó là quy tắc nghiệp vụ.
    Phần Responses liệt kê đủ mã lỗi nghiệp vụ có thể gặp (lỗi chung 400/401/403 dùng lại từ
    `components/responses`).
  contact:
    name: Triển (BE Lead)

servers:
  - url: http://localhost:3000/api/v1
    description: Backend chạy trên máy (npm run start:dev)
  - url: http://127.0.0.1:4010
    description: Mock Prism cho FE (npx prism mock docs/api/openapi.yaml)

# Mặc định mọi endpoint cần đăng nhập (Bearer). Endpoint công khai ghi `security: []`.
security:
  - bearerAuth: []

tags:
  - name: Xác thực
    description: Đăng ký, đăng nhập, giữ phiên, quên và đổi mật khẩu (UC01–UC04, UC06).
  - name: Hồ sơ
    description: Hồ sơ của người đang đăng nhập, ảnh đại diện, mã QR (UC05, UC15).
  - name: Gói
    description: Gói tập để bán. Khách xem không cần đăng nhập; Admin thêm, sửa, ngừng bán (UC07, UC08).
  - name: Đơn hàng
    description: |
      Mua gói hoặc gia hạn (UC09, UC14). Đơn **chụp lại điều khoản gói** lúc tạo; Admin sửa gói sau đó
      không ảnh hưởng đơn đã có. Gói hội viên chỉ sinh ra khi đơn có thanh toán SUCCESS.

      Trạng thái đơn: `PENDING` (chờ trả) → `PAID` | `CANCELLED` | `EXPIRED` (quá hạn: VNPay 30 phút,
      tiền mặt hết ngày).
  - name: Thanh toán
    description: |
      VNPay sandbox và tiền mặt (UC12–UC14). Trạng thái: `PENDING` → `SUCCESS` | `FAILED`.

      **Luồng VNPay:** tạo payment → FE chuyển sang `checkoutUrl` → VNPay gọi IPN về BE → BE kích hoạt gói →
      VNPay đưa người dùng về trang kết quả của FE. **FE không tin tham số trên return URL**; luôn gọi
      `GET /orders/{id}` (lặp mỗi 2–3 giây, tối đa khoảng 1 phút) để biết đơn đã `PAID` chưa.

      **Luồng tiền mặt:** tạo payment CASH → Staff nhận tiền → `POST /payments/{id}/confirm-cash`.
  - name: Gói hội viên
    description: |
      Gói đã mua, sinh ra khi đơn có thanh toán SUCCESS (UC10, UC11). Trạng thái: `ACTIVE` ⇄ `FROZEN`
      (bảo lưu), `ACTIVE` → `EXPIRED` | `CANCELLED`.

      Số buổi PT **không lưu cột**, BE tính từ lịch: đã tập = COMPLETED + NO_SHOW · đang giữ = PENDING + CONFIRMED ·
      còn lại = tổng − đã tập · có thể đặt = còn lại − đang giữ.
  - name: Check-in
    description: Ra vào phòng tập (UC16–UC18). Check-in không trừ buổi PT. Mỗi hội viên chỉ có 1 lượt chưa check-out; job 23:59 tự đóng lượt còn mở.
  - name: Hội viên
    description: |
      Staff, Admin tìm và quản lý hội viên tại quầy (UC19, UC20). PT xem hội viên mình phụ trách (UC28).

      "Khách hàng" và "hội viên" cùng là tài khoản MEMBER; hội viên là người có ít nhất 1 gói ACTIVE.
      API trả sẵn `hasActiveSubscription` để FE phân biệt, không lưu thành cột.
  - name: PT
    description: |
      Hồ sơ huấn luyện viên và khung giờ nhận lịch (UC21, UC22, UC28, UC33). Khách xem không cần đăng nhập.

      "PT phụ trách hội viên" suy ra từ lịch: có lịch PENDING, CONFIRMED hoặc COMPLETED với PT đó (quyết định 16).
  - name: Lịch PT
    description: |
      Lịch tập PT là **thỏa thuận giữa hai bên** (UC23–UC27). Mọi thay đổi là một đề xuất (`kind`):
      `INITIAL` (yêu cầu đầu), `COUNTER` (đề xuất giờ khác khi lịch còn PENDING), `RESCHEDULE` (xin đổi giờ lịch
      đã CONFIRMED), `CANCEL` (xin hủy lịch đã CONFIRMED).

      - Mỗi lịch có tối đa 1 đề xuất `OPEN`. Chỉ **bên đang được hỏi** (`awaitingRole`) mới được đồng ý, từ chối
        hoặc đề xuất giờ khác.
      - Mọi hành động gửi `expectedVersion` (lấy từ `version` của lịch). Thành công thì `version + 1`; lệch thì
        `409 STALE_VERSION`, FE tải lại lịch và hiện đề xuất mới nhất.
      - Đổi hoặc hủy lịch CONFIRMED phải được bên kia đồng ý; trong lúc chờ, lịch cũ giữ nguyên.
      - FE hiện nút theo `allowedActions` do BE trả, không tự suy luận.

      | Đề xuất | Được đồng ý | Bị từ chối |
      | --- | --- | --- |
      | INITIAL, COUNTER (lịch PENDING) | Lịch → CONFIRMED | Lịch → REJECTED, nhả buổi đang giữ |
      | RESCHEDULE (lịch CONFIRMED) | Giữ CONFIRMED, đổi sang giờ mới | Giữ giờ cũ |
      | CANCEL (lịch CONFIRMED) | Lịch → CANCELLED, không trừ buổi | Giữ nguyên |
  - name: Theo dõi tập
    description: PT phụ trách ghi chú tình trạng, lập kế hoạch và cập nhật tiến độ; hội viên xem của mình (UC29, UC30).
  - name: Tài khoản
    description: Admin quản lý tài khoản Staff, PT, Admin (UC31–UC35).
  - name: Lớp học
    description: |
      Lớp tập nhóm (UC36–UC38). Admin tạo từng buổi; không có lớp lặp tuần (quyết định 15, FE có nút nhân bản).
      Đăng ký cần gói ACTIVE có quyền vào lớp (`includesClass`), lớp còn chỗ; hủy đăng ký trước hạn hủy
      (mặc định 120 phút trước giờ học, quyết định 11).
  - name: Báo cáo
    description: Doanh thu, thống kê và xuất Excel, chỉ Admin (UC39–UC41). Staff không xem doanh thu (quyết định 19).
  - name: Thông báo
    description: Thông báo trong ứng dụng (chuông), của người đang đăng nhập; Admin gửi thông báo chủ động (UC42, UC43).
  - name: Vận hành
    description: Kiểm tra server.

# =============================================================================
# PATHS
# =============================================================================
paths:

  # ---------------------------------------------------------------------------
  # XÁC THỰC (7)
  # ---------------------------------------------------------------------------
  /auth/register:
    post:
      tags: [Xác thực]
      operationId: register
      summary: Đăng ký tài khoản khách hàng
      description: |
        **Quyền:** Public · **UC01**

        - Tạo tài khoản vai trò MEMBER kèm hồ sơ hội viên (mã hội viên, mã QR).
        - Số điện thoại là định danh đăng nhập, bắt buộc. Email không bắt buộc (Q15).
        - Thành công thì đăng nhập luôn: trả phiên như `POST /auth/login` và đặt cookie refresh.
        - Nếu SĐT trùng với hồ sơ Staff đã tạo tại quầy mà **chưa kích hoạt**: trả `409 ACTIVATION_REQUIRED`.
          FE hướng dẫn kích hoạt: có email thì qua "Quên mật khẩu", không có email thì đến quầy.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
            example:
              fullName: Nguyễn Văn An
              phone: '0901234567'
              email: an.nguyen@example.com
              dob: '1998-05-20'
              password: matkhau123
      responses:
        '201':
          description: Đã tạo tài khoản và đăng nhập.
          headers:
            Set-Cookie: { $ref: '#/components/headers/SetRefreshCookie' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthSession' }
              examples:
                SessionMember: { $ref: '#/components/examples/SessionMember' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409':
          description: SĐT hoặc email đã được dùng, hoặc SĐT thuộc hồ sơ tại quầy chưa kích hoạt.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                PHONE_DUPLICATED: { $ref: '#/components/examples/ErrPhoneDuplicated' }
                EMAIL_DUPLICATED: { $ref: '#/components/examples/ErrEmailDuplicated' }
                ACTIVATION_REQUIRED: { $ref: '#/components/examples/ErrActivationRequired' }

  /auth/login:
    post:
      tags: [Xác thực]
      operationId: login
      summary: Đăng nhập bằng số điện thoại
      description: |
        **Quyền:** Public · **UC02**

        - Chỉ nhận **số điện thoại** + mật khẩu (Q12).
        - Thành công: trả `accessToken` (15 phút) trong body, đặt cookie `refresh_token`.
        - Sai 5 lần liên tiếp: tạm khóa, trả `429 ACCOUNT_TEMPORARILY_LOCKED` kèm
          `details.retryAfterSeconds`. Đăng nhập đúng thì đếm lại từ 0.
        - Tài khoản bị Admin khóa: `403 ACCOUNT_LOCKED`.
        - Tài khoản tạo tại quầy chưa kích hoạt (chưa có mật khẩu): `401 INVALID_CREDENTIALS`
          như sai mật khẩu.

        **Ví dụ cho mock (Q8):** 4 example `admin`, `staff`, `trainer`, `member`. Với Prism chọn
        example bằng header `Prefer: example=staff`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
            examples:
              admin:
                summary: Đăng nhập Admin
                value: { phone: '0900000001', password: matkhau123 }
              staff:
                summary: Đăng nhập Staff
                value: { phone: '0900000002', password: matkhau123 }
              trainer:
                summary: Đăng nhập PT
                value: { phone: '0900000003', password: matkhau123 }
              member:
                summary: Đăng nhập hội viên
                value: { phone: '0901234567', password: matkhau123 }
      responses:
        '200':
          description: Đăng nhập thành công.
          headers:
            Set-Cookie: { $ref: '#/components/headers/SetRefreshCookie' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthSession' }
              examples:
                member: { $ref: '#/components/examples/SessionMember' }
                admin: { $ref: '#/components/examples/SessionAdmin' }
                staff: { $ref: '#/components/examples/SessionStaff' }
                trainer: { $ref: '#/components/examples/SessionTrainer' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401':
          description: Sai số điện thoại hoặc mật khẩu.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                INVALID_CREDENTIALS: { $ref: '#/components/examples/ErrInvalidCredentials' }
        '403':
          description: Tài khoản đã bị Admin khóa.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                ACCOUNT_LOCKED: { $ref: '#/components/examples/ErrAccountLocked' }
        '429':
          description: Đăng nhập sai quá 5 lần, tạm khóa.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                ACCOUNT_TEMPORARILY_LOCKED: { $ref: '#/components/examples/ErrAccountTemporarilyLocked' }

  /auth/refresh:
    post:
      tags: [Xác thực]
      operationId: refreshSession
      summary: Lấy access token mới từ cookie refresh
      description: |
        **Quyền:** Public (dựa vào cookie) · **UC02**

        - Không có body. Trình duyệt tự gửi cookie `refresh_token`; FE gọi với `credentials: 'include'`.
        - Thành công: trả phiên mới và đặt lại cookie (đổi refresh token mỗi lần gọi).
        - Cookie thiếu, hết hạn, hoặc phiên đã bị thu hồi (khóa tài khoản, đổi mật khẩu): `401 UNAUTHENTICATED`.
        - FE gọi khi tải lại trang và khi một request gặp 401.
      security:
        - refreshCookie: []
      responses:
        '200':
          description: Phiên mới.
          headers:
            Set-Cookie: { $ref: '#/components/headers/SetRefreshCookie' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthSession' }
              examples:
                SessionMember: { $ref: '#/components/examples/SessionMember' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /auth/logout:
    post:
      tags: [Xác thực]
      operationId: logout
      summary: Đăng xuất
      description: |
        **Quyền:** Đã đăng nhập · **UC03**

        Xóa cookie refresh trên thiết bị này (ADR 0001: không thu hồi riêng từng thiết bị).
        FE xóa access token trong bộ nhớ rồi về trang đăng nhập.
      responses:
        '204':
          description: Đã đăng xuất.
          headers:
            Set-Cookie: { $ref: '#/components/headers/ClearRefreshCookie' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /auth/forgot-password:
    post:
      tags: [Xác thực]
      operationId: forgotPassword
      summary: Quên mật khẩu hoặc kích hoạt tài khoản tạo tại quầy
      description: |
        **Quyền:** Public · **UC04**

        - Người dùng nhập số điện thoại. Nếu tài khoản có email, BE gửi link đặt mật khẩu tới email đó,
          hạn 30 phút (quyết định 1). Link dạng `<FE>/reset-password?token=...`.
        - Dùng chung cho **kích hoạt** tài khoản Staff tạo tại quầy (chưa có mật khẩu).
        - Để không lộ SĐT nào đã đăng ký, BE luôn trả `202` khi SĐT không tồn tại.
        - Giới hạn tần suất: gọi quá nhiều lần trả `429 RATE_LIMITED`.

        **Chưa chốt (Q16, Q17):** tài khoản **không có email** (Q15) cần mã lỗi riêng để FE hiện
        "Liên hệ quầy để đặt lại mật khẩu". Nhưng trả mã riêng sẽ cho người lạ biết SĐT đó đã đăng ký,
        ngược với quy tắc "luôn trả 202" ở trên. Chờ chốt; trong lúc chờ, BE trả `202`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ForgotPasswordRequest' }
            example: { phone: '0901234567' }
      responses:
        '202':
          description: Đã nhận yêu cầu. Nếu tài khoản có email, link đặt mật khẩu đã được gửi.
        '400': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/reset-password:
    post:
      tags: [Xác thực]
      operationId: resetPassword
      summary: Đặt mật khẩu mới bằng link trong email
      description: |
        **Quyền:** Public · **UC04**

        - `token` lấy từ link email. Mỗi token dùng một lần, hạn 30 phút.
        - Thành công: đặt mật khẩu mới, kích hoạt tài khoản nếu chưa kích hoạt, thu hồi mọi phiên cũ.
          FE chuyển về trang đăng nhập.
        - Token sai, hết hạn hoặc đã dùng: `400 TOKEN_EXPIRED`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResetPasswordRequest' }
            example: { token: 9f8c2d1e7b6a4f3e9d8c7b6a5f4e3d2c, newPassword: matkhaumoi456 }
      responses:
        '204':
          description: Đã đặt mật khẩu mới.
        '400':
          description: Dữ liệu sai, hoặc link đã hết hạn / đã dùng.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                TOKEN_EXPIRED: { $ref: '#/components/examples/ErrTokenExpired' }
                VALIDATION_ERROR: { $ref: '#/components/examples/ErrValidation' }

  /auth/change-password:
    post:
      tags: [Xác thực]
      operationId: changePassword
      summary: Đổi mật khẩu
      description: |
        **Quyền:** Đã đăng nhập · **UC06**

        - Cần nhập đúng mật khẩu hiện tại.
        - Mật khẩu hiện tại sai trả `400 VALIDATION_ERROR` với `details[0].field = "currentPassword"`
          (không dùng 401 để FE không nhầm là hết phiên và gọi refresh).
        - Thành công: thu hồi mọi phiên ở thiết bị khác; thiết bị hiện tại nhận cookie refresh mới
          và access token mới trong body nên không bị đăng xuất.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangePasswordRequest' }
            example: { currentPassword: matkhau123, newPassword: matkhaumoi456 }
      responses:
        '200':
          description: Đã đổi mật khẩu, trả phiên mới cho thiết bị này.
          headers:
            Set-Cookie: { $ref: '#/components/headers/SetRefreshCookie' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthSession' }
              examples:
                SessionMember: { $ref: '#/components/examples/SessionMember' }
        '400':
          description: Dữ liệu sai hoặc mật khẩu hiện tại không đúng.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                wrongCurrentPassword: { $ref: '#/components/examples/ErrWrongCurrentPassword' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  # ---------------------------------------------------------------------------
  # HỒ SƠ (3 + 1 tạo lại QR theo Q6)
  # ---------------------------------------------------------------------------
  /me:
    get:
      tags: [Hồ sơ]
      operationId: getMe
      summary: Xem hồ sơ của tôi
      description: |
        **Quyền:** Đã đăng nhập · **UC05, UC15**

        Trả thông tin chung của tài khoản và phần riêng theo vai trò:
        - MEMBER: `member` (mã hội viên, `qrToken` để FE vẽ mã QR, có gói ACTIVE hay chưa).
        - TRAINER: `trainer` (chuyên môn, giới thiệu, số năm kinh nghiệm).
        - STAFF: `shift` (ca làm).
        Phần không thuộc vai trò trả `null`.
      responses:
        '200':
          description: Hồ sơ của tôi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
              examples:
                member: { $ref: '#/components/examples/MeMember' }
                trainer: { $ref: '#/components/examples/MeTrainer' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
    patch:
      tags: [Hồ sơ]
      operationId: updateMe
      summary: Sửa hồ sơ của tôi
      description: |
        **Quyền:** Đã đăng nhập · **UC05**

        - Chỉ gửi field muốn đổi. Gửi `email: null` để xóa email.
        - Không đổi được số điện thoại (định danh đăng nhập), vai trò, trạng thái ở đây.
          Muốn đổi SĐT thì nhờ Staff (`PATCH /members/{id}`) hoặc Admin (`PATCH /users/{id}`).
        - `avatarUrl` lấy từ kết quả `POST /uploads/avatar`.
        - Nhóm field `trainer` chỉ PT được gửi; vai trò khác gửi thì `400 VALIDATION_ERROR`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateMeRequest' }
            example: { fullName: Nguyễn Văn An, email: an.moi@example.com, dob: '1998-05-20' }
      responses:
        '200':
          description: Hồ sơ sau khi sửa.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
              examples:
                MeMember: { $ref: '#/components/examples/MeMember' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '409':
          description: Email đã được tài khoản khác dùng.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                EMAIL_DUPLICATED: { $ref: '#/components/examples/ErrEmailDuplicated' }

  /me/qr-token/regenerate:
    post:
      tags: [Hồ sơ]
      operationId: regenerateMyQrToken
      summary: Tạo lại mã QR khi bị lộ
      description: |
        **Quyền:** MEMBER · **UC15** · Quyết định 13, Q6

        - Mã QR cố định; chỉ đổi khi hội viên bấm "Tạo lại mã QR". Mã cũ hết hiệu lực ngay
          (quét mã cũ ở quầy nhận `INVALID_QR`).
        - **Chờ cập nhật:** endpoint này chưa có trong `docs/spec/api-v3.md` (Huy Trường bổ sung theo Q6).
      x-spec-status: chờ api-v3 (Q6)
      responses:
        '200':
          description: Mã QR mới.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QrTokenResponse' }
              example: { qrToken: QR-2f7c9a1b8e6d4c3a }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /uploads/avatar:
    post:
      tags: [Hồ sơ]
      operationId: uploadAvatar
      summary: Tải ảnh đại diện
      description: |
        **Quyền:** Đã đăng nhập · **UC05**

        - Gửi `multipart/form-data`, field `file`. Chỉ nhận JPEG hoặc PNG.
        - Trả `avatarUrl`; FE gửi tiếp `PATCH /me` với `avatarUrl` này để lưu vào hồ sơ.
        - Sai định dạng: `422 INVALID_FILE`.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: Ảnh JPEG hoặc PNG.
      responses:
        '201':
          description: Đã tải ảnh lên.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AvatarUploadResponse' }
              example: { avatarUrl: /uploads/avatars/44444444-4444-4444-8444-444444444444.jpg }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422':
          description: File không phải JPEG/PNG.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                INVALID_FILE: { $ref: '#/components/examples/ErrInvalidFile' }

  # ---------------------------------------------------------------------------
  # GÓI (4)
  # ---------------------------------------------------------------------------
  /packages:
    get:
      tags: [Gói]
      operationId: listPackages
      summary: Xem, tìm, lọc gói
      description: |
        **Quyền:** Public · **UC07**

        - Khách và hội viên chỉ thấy gói `ACTIVE` (đang bán). Admin thấy cả gói ngừng bán và lọc
          được theo `status`.
        - Tìm `q` theo tên gói, không phân biệt dấu và hoa thường.
        - Sắp xếp mặc định: giá tăng dần.
        - So sánh gói (UC07) là việc của FE: chọn nhiều gói từ danh sách rồi hiển thị cạnh nhau.
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: q
          in: query
          description: Từ khóa trong tên gói.
          schema: { type: string, maxLength: 100 }
        - name: type
          in: query
          description: Loại gói.
          schema: { $ref: '#/components/schemas/PackageType' }
        - name: minPrice
          in: query
          description: Giá từ (VND).
          schema: { type: integer, minimum: 0 }
        - name: maxPrice
          in: query
          description: Giá đến (VND).
          schema: { type: integer, minimum: 0 }
        - name: durationUnit
          in: query
          description: Đơn vị thời hạn. Dùng cùng `durationValue` để lọc đúng thời hạn, ví dụ 3 tháng.
          schema: { $ref: '#/components/schemas/DurationUnit' }
        - name: durationValue
          in: query
          description: Số đơn vị thời hạn.
          schema: { type: integer, minimum: 1 }
        - name: status
          in: query
          description: Chỉ Admin dùng được. Không gửi thì Admin thấy mọi trạng thái.
          schema: { $ref: '#/components/schemas/PackageStatus' }
      responses:
        '200':
          description: Danh sách gói.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Package' }
                  meta: { $ref: '#/components/schemas/PageMeta' }
              examples:
                PackageGymList: { $ref: '#/components/examples/PackageGymList' }
        '400': { $ref: '#/components/responses/ValidationError' }
    post:
      tags: [Gói]
      operationId: createPackage
      summary: Thêm gói
      description: |
        **Quyền:** ADMIN · **UC08**

        - Gói `GYM`: `totalSessions` và `sessionMinutes` để `null`.
        - Gói `PT`: bắt buộc `totalSessions` và `sessionMinutes`.
        - Gói mới có trạng thái `ACTIVE`. Ghi `audit_logs`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePackageRequest' }
            example:
              name: PT 12 buổi
              description: 12 buổi tập 1 kèm 1 với PT trong 2 tháng.
              type: PT
              price: 6000000
              durationValue: 2
              durationUnit: MONTH
              totalSessions: 12
              sessionMinutes: 60
              includesClass: true
              benefits: [Tập 1 kèm 1, Đo InBody mỗi tháng, Vào lớp nhóm]
      responses:
        '201':
          description: Đã tạo gói.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Package' }
              examples:
                PackagePt: { $ref: '#/components/examples/PackagePt' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /packages/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Gói]
      operationId: getPackage
      summary: Xem chi tiết gói
      description: |
        **Quyền:** Public · **UC07**

        Khách xem được cả gói đã ngừng bán (để mở lại link cũ), nhưng không mua được.
      security:
        - {}
        - bearerAuth: []
      responses:
        '200':
          description: Chi tiết gói.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Package' }
              examples:
                PackageGym: { $ref: '#/components/examples/PackageGym' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Gói]
      operationId: updatePackage
      summary: Sửa gói hoặc ngừng bán
      description: |
        **Quyền:** ADMIN · **UC08**

        - Chỉ gửi field muốn đổi. Ngừng bán: `status: INACTIVE`; bán lại: `status: ACTIVE`.
        - Không đổi được `type`.
        - Đổi giá, thời hạn, số buổi **không ảnh hưởng** đơn và gói hội viên đã có (đơn chụp điều khoản).
        - Ghi `audit_logs` với giá trị trước và sau.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdatePackageRequest' }
            example: { price: 1300000, benefits: [Tập không giới hạn, Tủ đồ miễn phí] }
      responses:
        '200':
          description: Gói sau khi sửa.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Package' }
              examples:
                PackageGym: { $ref: '#/components/examples/PackageGym' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------------------
  # ĐƠN HÀNG (5)
  # ---------------------------------------------------------------------------
  /orders/quote:
    post:
      tags: [Đơn hàng]
      operationId: quoteOrder
      summary: Báo giá trước khi mua
      description: |
        **Quyền:** MEMBER (cho mình), STAFF, ADMIN (mua hộ, phải gửi `memberId`) · **UC09**

        - Không tạo gì trong DB; chỉ tính `total` và `endsOn` để FE hiện màn xác nhận.
        - Body giống `POST /orders`. Lỗi trả về cũng giống `POST /orders` (trừ `PENDING_ORDER_EXISTS`).
        - Cách tính ngày (quyết định 12): `endsOn = startsOn + thời hạn − 1 ngày`, tính cả ngày `endsOn`.
          Ví dụ 31/01 + 1 tháng → kết thúc 27/02.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrderRequest' }
            example: { packageId: 77777777-7777-4777-8777-777777777777, startsOn: '2026-10-10' }
      responses:
        '200':
          description: Báo giá.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderQuote' }
              example:
                packageId: 77777777-7777-4777-8777-777777777777
                packageName: Gym 1 tháng
                type: GYM
                price: 500000
                total: 500000
                durationValue: 1
                durationUnit: MONTH
                totalSessions: null
                sessionMinutes: null
                includesClass: false
                startsOn: '2026-10-10'
                endsOn: '2026-11-09'
                renewalOf: null
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    x-note: Báo giá dùng POST vì có body; không thay đổi dữ liệu.

  /orders:
    post:
      tags: [Đơn hàng]
      operationId: createOrder
      summary: Tạo đơn mua hoặc gia hạn gói
      description: |
        **Quyền:** MEMBER (cho mình), STAFF, ADMIN (mua hộ, phải gửi `memberId`) · **UC09**

        - Tạo đơn `PENDING`, chụp lại điều khoản gói (giá, thời hạn, số buổi, phút/buổi, quyền vào lớp).
        - **Gia hạn:** gửi `renewalOf` là id gói hội viên đang có. Không gửi `startsOn` thì BE lấy
          ngày sau `endsOn` của gói cũ. Mua mới không gửi `startsOn` thì lấy hôm nay.
        - `startsOn` không được trước hôm nay.
        - Gói đã ngừng bán: `400 VALIDATION_ERROR` (`details[0].field = "packageId"`).
        - Đã có đơn `PENDING` cùng gói: `409 PENDING_ORDER_EXISTS` kèm `details.orderId`;
          FE mở lại đơn đó thay vì tạo mới.
        - `expiresAt` là hạn thanh toán, BE tính lúc chọn phương thức (VNPay 30 phút, tiền mặt hết ngày);
          trước khi chọn là hết ngày.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrderRequest' }
            examples:
              memberSelf:
                summary: Hội viên tự mua
                value: { packageId: 77777777-7777-4777-8777-777777777777, startsOn: '2026-10-10' }
              staffForMember:
                summary: Staff mua hộ tại quầy
                value:
                  packageId: 77777777-7777-4777-8777-777777777777
                  memberId: 55555555-5555-4555-8555-555555555555
              renewal:
                summary: Gia hạn gói đang có
                value:
                  packageId: 77777777-7777-4777-8777-777777777777
                  renewalOf: bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb
      responses:
        '201':
          description: Đã tạo đơn.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
              examples:
                OrderPending: { $ref: '#/components/examples/OrderPending' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Đã có đơn chờ thanh toán cho gói này.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                PENDING_ORDER_EXISTS: { $ref: '#/components/examples/ErrPendingOrderExists' }
    get:
      tags: [Đơn hàng]
      operationId: listOrders
      summary: Lịch sử đơn
      description: |
        **Quyền:** MEMBER (đơn của mình), STAFF, ADMIN · **UC14**

        - MEMBER: luôn chỉ thấy đơn của mình, `memberId` bị bỏ qua.
        - Sắp xếp: mới nhất trước.
        - **Chưa chốt (Q17):** STAFF có bị giới hạn đơn trong ngày như `GET /payments` (quyết định 19) không.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/MemberIdQuery'
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/OrderStatus' }
        - $ref: '#/components/parameters/FromDate'
        - $ref: '#/components/parameters/ToDate'
      responses:
        '200':
          description: Danh sách đơn.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Order' }
                  meta: { $ref: '#/components/schemas/PageMeta' }
              examples:
                OrderPaidList: { $ref: '#/components/examples/OrderPaidList' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /orders/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Đơn hàng]
      operationId: getOrder
      summary: Xem chi tiết đơn (kèm biên lai khi đã trả)
      description: |
        **Quyền:** MEMBER (của mình), STAFF, ADMIN · **UC14, UC12**

        - Kèm danh sách `payments` của đơn.
        - Khi `status = PAID`: có `receipt` (biên lai nội bộ, in bằng trình duyệt) và `subscriptionId`.
        - Đây là nguồn duy nhất để FE biết đã thanh toán xong (sau khi quay về từ VNPay).
      responses:
        '200':
          description: Chi tiết đơn.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
              examples:
                pending: { $ref: '#/components/examples/OrderPending' }
                paid: { $ref: '#/components/examples/OrderPaid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /orders/{id}/cancel:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      tags: [Đơn hàng]
      operationId: cancelOrder
      summary: Hủy đơn chưa thanh toán
      description: |
        **Quyền:** MEMBER (của mình), STAFF, ADMIN · **UC09**

        - Chỉ hủy được đơn `PENDING`. Payment `PENDING` của đơn chuyển `FAILED`.
        - Staff/Admin hủy hộ thì ghi `audit_logs` kèm `reason`.
        - Gửi lặp khi đơn đã `CANCELLED`: trả `200` với đơn hiện tại.

        **Chưa chốt (Q16):** mã lỗi khi đơn đã `PAID` hoặc `EXPIRED`. Hồng Anh bổ sung vào `error-codes.md`.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CancelOrderRequest' }
            example: { reason: 'Khách đổi ý, chọn gói khác' }
      responses:
        '200':
          description: Đơn sau khi hủy.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------------------
  # THANH TOÁN (5)
  # ---------------------------------------------------------------------------
  /orders/{id}/payments:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      tags: [Thanh toán]
      operationId: createPayment
      summary: Chọn phương thức và tạo thanh toán cho đơn
      description: |
        **Quyền:** MEMBER (đơn của mình), STAFF, ADMIN · **UC12, UC13**

        - `VNPAY`: trả `checkoutUrl`; FE chuyển trình duyệt sang địa chỉ này. Hạn đơn thành 30 phút.
        - `CASH`: trả payment `PENDING`; hạn đơn là hết ngày. Staff xác nhận bằng
          `POST /payments/{id}/confirm-cash` khi nhận tiền.
        - Đơn đã có payment `PENDING` (ví dụ bấm thanh toán lại): BE chuyển payment cũ sang `FAILED`
          rồi tạo payment mới. Mỗi đơn chỉ có tối đa 1 payment `PENDING`.
        - `amount` luôn bằng `total` của đơn; FE không gửi số tiền.

        **Chưa chốt (Q16):** mã lỗi khi đơn không còn `PENDING` (đã trả, đã hủy, quá hạn).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePaymentRequest' }
            examples:
              vnpay:
                summary: Thanh toán VNPay
                value: { method: VNPAY }
              cash:
                summary: Trả tiền mặt tại quầy
                value: { method: CASH }
      responses:
        '201':
          description: Đã tạo thanh toán.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Payment' }
              examples:
                vnpay: { $ref: '#/components/examples/PaymentVnpayPending' }
                cash: { $ref: '#/components/examples/PaymentCashPending' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /payments:
    get:
      tags: [Thanh toán]
      operationId: listPayments
      summary: Lịch sử giao dịch
      description: |
        **Quyền:** MEMBER (của mình), STAFF (chỉ trong ngày), ADMIN · **UC14**

        - MEMBER: chỉ thấy giao dịch của mình.
        - STAFF: chỉ xem giao dịch **hôm nay** để đối soát tiền mặt (quyết định 19); `from`, `to` bị
          BE đặt về hôm nay.
        - Sắp xếp: mới nhất trước.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/FromDate'
        - $ref: '#/components/parameters/ToDate'
        - name: method
          in: query
          schema: { $ref: '#/components/schemas/PaymentMethod' }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/PaymentStatus' }
        - $ref: '#/components/parameters/MemberIdQuery'
      responses:
        '200':
          description: Danh sách giao dịch.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Payment' }
                  meta: { $ref: '#/components/schemas/PageMeta' }
              examples:
                PaymentCashSuccessList: { $ref: '#/components/examples/PaymentCashSuccessList' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /payments/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Thanh toán]
      operationId: getPayment
      summary: Xem chi tiết giao dịch
      description: |
        **Quyền:** MEMBER (của mình), STAFF (trong ngày), ADMIN · **UC14**
      responses:
        '200':
          description: Chi tiết giao dịch.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Payment' }
              examples:
                PaymentCashSuccess: { $ref: '#/components/examples/PaymentCashSuccess' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /payments/{id}/confirm-cash:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      tags: [Thanh toán]
      operationId: confirmCashPayment
      summary: Xác nhận đã nhận tiền mặt
      description: |
        **Quyền:** STAFF, ADMIN · **UC13**

        - `receivedAmount` phải **bằng** số tiền cần thu; khác thì `422 CASH_AMOUNT_MISMATCH`
          (kèm `details.expectedAmount`).
        - Thành công, trong **một transaction**: payment `SUCCESS` → đơn `PAID` + `receiptNo` → tạo gói hội viên
          `ACTIVE` → thông báo cho hội viên → ghi `audit_logs`.
        - Gửi lặp khi payment đã `SUCCESS`: trả `200` với kết quả cũ, không tạo gói lần hai.
        - Payment không phải `CASH`: `400 VALIDATION_ERROR`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfirmCashRequest' }
            example: { receivedAmount: 500000 }
      responses:
        '200':
          description: Đã xác nhận; đơn đã PAID.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Payment' }
              examples:
                PaymentCashSuccess: { $ref: '#/components/examples/PaymentCashSuccess' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: Số tiền nhận khác số tiền cần thu.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                CASH_AMOUNT_MISMATCH: { $ref: '#/components/examples/ErrCashAmountMismatch' }

  /payments/vnpay/ipn:
    get:
      tags: [Thanh toán]
      operationId: vnpayIpn
      summary: VNPay báo kết quả thanh toán (IPN)
      description: |
        **Quyền:** chỉ VNPay gọi (kiểm chữ ký `vnp_SecureHash`) · **UC12** · **FE không gọi endpoint này.**

        - Tham số là bộ `vnp_*` theo tài liệu VNPay; dưới đây chỉ liệt kê các tham số BE dùng.
        - BE xử lý theo thứ tự: kiểm chữ ký → tìm payment theo `vnp_TxnRef` (= `merchantRef`) →
          so số tiền (`vnp_Amount` = amount × 100) → nếu thành công thì kích hoạt gói trong một transaction
          (như confirm-cash) → lưu toàn bộ tham số vào `gateway_payload`.
        - VNPay báo thất bại hoặc người dùng hủy: payment `FAILED`, đơn vẫn `PENDING` (trả lại được), thông báo
          `PAYMENT_FAILED`, trả `RspCode 00`. Sơ đồ: `docs/design/sequence-diagrams.md`.
        - VNPay có thể gọi lặp: lần sau trả `RspCode 02`, không tạo gói lần hai
          (chặn bằng unique `gateway_txn_id`).
        - **Chưa chốt (Q17):** IPN báo thành công cho payment đã bị chuyển `FAILED` (người dùng bấm thanh toán
          lại nhưng vẫn trả bằng link cũ).
        - Response **không** theo dạng lỗi chung mà theo định dạng VNPay yêu cầu: luôn HTTP 200 với
          `{ RspCode, Message }`.

        | RspCode | Ý nghĩa |
        | --- | --- |
        | 00 | Đã ghi nhận |
        | 01 | Không tìm thấy giao dịch |
        | 02 | Giao dịch đã được xử lý trước đó |
        | 04 | Sai số tiền |
        | 97 | Sai chữ ký |
        | 99 | Lỗi khác |
      security: []
      parameters:
        - { name: vnp_TxnRef, in: query, required: true, description: 'Mã giao dịch phía mình (merchantRef).', schema: { type: string } }
        - { name: vnp_Amount, in: query, required: true, description: 'Số tiền × 100.', schema: { type: string } }
        - { name: vnp_ResponseCode, in: query, required: true, description: "`00` là thanh toán thành công.", schema: { type: string } }
        - { name: vnp_TransactionStatus, in: query, required: true, description: "`00` là giao dịch thành công.", schema: { type: string } }
        - { name: vnp_TransactionNo, in: query, required: true, description: 'Mã giao dịch phía VNPay (gatewayTxnId).', schema: { type: string } }
        - { name: vnp_SecureHash, in: query, required: true, description: 'Chữ ký HMAC SHA512.', schema: { type: string } }
      responses:
        '200':
          description: Kết quả xử lý gửi lại cho VNPay.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VnpayIpnResponse' }
              example: { RspCode: '00', Message: Confirm Success }

  # ---------------------------------------------------------------------------
  # GÓI HỘI VIÊN (4)
  # ---------------------------------------------------------------------------
  /subscriptions:
    get:
      tags: [Gói hội viên]
      operationId: listSubscriptions
      summary: Gói của tôi, lịch sử gói
      description: |
        **Quyền:** MEMBER (của mình), STAFF, ADMIN · **UC10**

        - MEMBER: luôn chỉ thấy gói của mình, `memberId` bị bỏ qua.
        - Không gửi `status` thì trả mọi trạng thái (dùng cho "lịch sử gói"). Lọc nhiều trạng thái:
          `status=ACTIVE&status=FROZEN`.
        - Gói PT có `sessions` tính sẵn; gói GYM là `null`.
        - Sắp xếp: `endsOn` muộn nhất trước.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/MemberIdQuery'
        - name: status
          in: query
          style: form
          explode: true
          description: Một hoặc nhiều trạng thái.
          schema:
            type: array
            items: { $ref: '#/components/schemas/SubscriptionStatus' }
        - name: type
          in: query
          schema: { $ref: '#/components/schemas/PackageType' }
      responses:
        '200':
          description: Danh sách gói hội viên.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Subscription' }
                  meta: { $ref: '#/components/schemas/PageMeta' }
              examples:
                SubscriptionPtList: { $ref: '#/components/examples/SubscriptionPtList' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /subscriptions/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Gói hội viên]
      operationId: getSubscription
      summary: Xem chi tiết gói (số buổi theo tháng, bảo lưu)
      description: |
        **Quyền:** MEMBER (của mình), STAFF, ADMIN · **UC10**

        - `monthlySessions`: số buổi PT phân bổ theo tháng (theo giờ bắt đầu của lịch, giờ Việt Nam), đủ các tháng
          từ `startsOn` đến `endsOn`, kể cả tháng không có buổi nào. Gói GYM là mảng rỗng.
        - `freeze`: thông tin bảo lưu (mỗi gói tối đa 1 lần nên đây cũng là lịch sử bảo lưu); `null` nếu chưa bảo lưu.
      responses:
        '200':
          description: Chi tiết gói hội viên.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubscriptionDetail' }
              examples:
                SubscriptionPtDetail: { $ref: '#/components/examples/SubscriptionPtDetail' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /subscriptions/{id}/freeze:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      tags: [Gói hội viên]
      operationId: freezeSubscription
      summary: Bảo lưu gói
      description: |
        **Quyền:** STAFF, ADMIN · **UC11** · Quyết định 10

        - Chỉ bảo lưu gói `ACTIVE`: khác thì `409 SUBSCRIPTION_NOT_ACTIVE`.
        - Tối đa **1 lần mỗi gói**, `days` từ 1 đến 30. Bảo lưu bắt đầu từ hôm nay (`freeze.frozenFrom`).
        - Gói còn lịch PT trong tương lai (PENDING hoặc CONFIRMED): `409 FREEZE_BLOCKED_BY_APPOINTMENTS` kèm
          `details.appointmentIds`; FE hiện các lịch vướng để hủy hoặc hoàn tất trước.
        - Thành công: gói `FROZEN`, thông báo cho hội viên, ghi `audit_logs` kèm `reason`.
        - Trong lúc bảo lưu, gói không dùng được để check-in (`SUBSCRIPTION_FROZEN`), đặt lịch PT hay đăng ký lớp.

        **Chưa chốt (Q21):** mã lỗi khi gói đã bảo lưu 1 lần (Hồng Anh bổ sung vào `error-codes.md`).
        **Chưa chốt (Q20):** hết số ngày bảo lưu thì gói tự mở lại (cần thêm job) hay chờ Staff mở.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FreezeSubscriptionRequest' }
            example: { days: 14, reason: Đi công tác 2 tuần }
      responses:
        '200':
          description: Gói sau khi bảo lưu.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubscriptionDetail' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Gói không ở trạng thái ACTIVE, hoặc còn lịch PT sắp tới.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                SUBSCRIPTION_NOT_ACTIVE: { $ref: '#/components/examples/ErrSubscriptionNotActive' }
                FREEZE_BLOCKED_BY_APPOINTMENTS: { $ref: '#/components/examples/ErrFreezeBlockedByAppointments' }

  /subscriptions/{id}/unfreeze:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      tags: [Gói hội viên]
      operationId: unfreezeSubscription
      summary: Mở lại gói đang bảo lưu
      description: |
        **Quyền:** STAFF, ADMIN · **UC11** · Quyết định 10

        - Chỉ mở gói `FROZEN`: khác thì `409 SUBSCRIPTION_NOT_FROZEN`.
        - Gói về `ACTIVE`, `endsOn` được cộng thêm số ngày bảo lưu (BE tính, trả `endsOn` mới).
        - Thông báo cho hội viên, ghi `audit_logs`.

        **Chưa chốt (Q20):** mở lại sớm hơn số ngày đã đăng ký thì cộng số ngày thực tế đã bảo lưu hay số ngày đã đăng ký.
      responses:
        '200':
          description: Gói sau khi mở lại.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubscriptionDetail' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Gói không đang bảo lưu.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                SUBSCRIPTION_NOT_FROZEN: { $ref: '#/components/examples/ErrSubscriptionNotFrozen' }

  # ---------------------------------------------------------------------------
  # CHECK-IN (3)
  # ---------------------------------------------------------------------------
  /check-ins:
    post:
      tags: [Check-in]
      operationId: createCheckIn
      summary: Check-in bằng QR hoặc số điện thoại
      description: |
        **Quyền:** STAFF, ADMIN · **UC16**

        - Gửi `qrToken` (quét QR) **hoặc** `phone` (nhập tay), không gửi cả hai.
        - BE tự chọn gói có quyền vào phòng còn hiệu lực hôm nay và trả trong `subscription`.
        - Gói còn 7 ngày trở xuống: `expiringSoon = true` để FE hiện cảnh báo "sắp hết hạn".
        - Thứ tự kiểm tra và mã lỗi:
          1. QR không khớp ai: `422 INVALID_QR`. SĐT không khớp hội viên nào: `404 NOT_FOUND`.
          2. Còn lượt chưa check-out: `409 ALREADY_CHECKED_IN` (kèm `details.checkInId`).
          3. Không có gói nào: `422 NO_ACTIVE_SUBSCRIPTION`. Gói gần nhất đã hết hạn: `422 SUBSCRIPTION_EXPIRED`.
             Gói đang bảo lưu: `422 SUBSCRIPTION_FROZEN`.
        - Check-in **không trừ** buổi PT.
        - **Chưa chốt (Q17):** gói đã mua nhưng chưa tới `startsOn`; gói PT có được vào phòng tập tự do không.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateCheckInRequest' }
            examples:
              qr:
                summary: Quét mã QR
                value: { qrToken: QR-7d3e1f9a2b4c6e8f }
              phone:
                summary: Nhập số điện thoại
                value: { phone: '0901234567' }
      responses:
        '201':
          description: Đã check-in.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CheckIn' }
              examples:
                CheckInOpen: { $ref: '#/components/examples/CheckInOpen' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Hội viên đang trong phòng (chưa check-out lượt trước).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                ALREADY_CHECKED_IN: { $ref: '#/components/examples/ErrAlreadyCheckedIn' }
        '422':
          description: QR sai hoặc không có gói còn hiệu lực.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                INVALID_QR: { $ref: '#/components/examples/ErrInvalidQr' }
                NO_ACTIVE_SUBSCRIPTION: { $ref: '#/components/examples/ErrNoActiveSubscription' }
                SUBSCRIPTION_EXPIRED: { $ref: '#/components/examples/ErrSubscriptionExpired' }
                SUBSCRIPTION_FROZEN: { $ref: '#/components/examples/ErrSubscriptionFrozen' }
    get:
      tags: [Check-in]
      operationId: listCheckIns
      summary: Lịch sử ra vào, người đang trong phòng
      description: |
        **Quyền:** MEMBER (của mình), STAFF, ADMIN · **UC18**

        - `present=true`: chỉ lấy lượt chưa check-out (người đang tập).
        - MEMBER: chỉ thấy của mình.
        - Sắp xếp: check-in mới nhất trước.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/MemberIdQuery'
        - $ref: '#/components/parameters/FromDate'
        - $ref: '#/components/parameters/ToDate'
        - name: present
          in: query
          description: "`true` chỉ lấy người đang trong phòng."
          schema: { type: boolean }
      responses:
        '200':
          description: Danh sách lượt ra vào.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/CheckIn' }
                  meta: { $ref: '#/components/schemas/PageMeta' }
              examples:
                CheckInOpenList: { $ref: '#/components/examples/CheckInOpenList' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /check-ins/{id}/checkout:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      tags: [Check-in]
      operationId: checkOut
      summary: Check-out
      description: |
        **Quyền:** MEMBER (lượt của mình), STAFF, ADMIN · **UC17**

        - Hội viên tự bấm: `checkoutType = SELF`. Staff làm hộ: `STAFF`. Job 23:59: `AUTO`.
        - Gửi lặp khi lượt đã check-out: trả `200` với lượt hiện tại.
      responses:
        '200':
          description: Lượt sau khi check-out.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CheckIn' }
              examples:
                CheckInClosed: { $ref: '#/components/examples/CheckInClosed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------------------
  # HỘI VIÊN (4 + 1 đặt lại mật khẩu tại quầy theo Q15)
  # ---------------------------------------------------------------------------
  /members:
    get:
      tags: [Hội viên]
      operationId: listMembers
      summary: Tìm hội viên
      description: |
        **Quyền:** STAFF, ADMIN; TRAINER chỉ thấy hội viên mình phụ trách · **UC19, UC28**

        - `q` tìm theo tên (không dấu), số điện thoại hoặc mã hội viên.
        - PT phụ trách = có lịch PENDING/CONFIRMED/COMPLETED với PT đó (quyết định 16).
        - Sắp xếp: tạo mới nhất trước.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: q
          in: query
          description: Tên, SĐT hoặc mã hội viên.
          schema: { type: string, maxLength: 100 }
        - name: hasActiveSubscription
          in: query
          description: "`true` chỉ hội viên có gói ACTIVE; `false` chỉ khách hàng chưa có gói."
          schema: { type: boolean }
      responses:
        '200':
          description: Danh sách hội viên.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Member' }
                  meta: { $ref: '#/components/schemas/PageMeta' }
              examples:
                MemberAnList: { $ref: '#/components/examples/MemberAnList' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Hội viên]
      operationId: createMember
      summary: Thêm hội viên tại quầy
      description: |
        **Quyền:** STAFF, ADMIN · **UC20**

        - Tạo tài khoản MEMBER **chưa có mật khẩu** (`accountActivated = false`).
        - Kích hoạt: có email thì khách dùng "Quên mật khẩu"; không có email thì Staff đặt mật khẩu tại quầy
          (`POST /members/{id}/reset-password`).
        - SĐT đã dùng: `409 PHONE_DUPLICATED` (kèm `details.memberId` nếu là hội viên, để FE mở hồ sơ đó).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateMemberRequest' }
            example: { fullName: Trần Thị Bình, phone: '0912345678', email: null, dob: '2000-01-15' }
      responses:
        '201':
          description: Đã tạo hội viên.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemberDetail' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: SĐT hoặc email đã được dùng.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                PHONE_DUPLICATED: { $ref: '#/components/examples/ErrPhoneDuplicated' }
                EMAIL_DUPLICATED: { $ref: '#/components/examples/ErrEmailDuplicated' }

  /members/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Hội viên]
      operationId: getMember
      summary: Xem chi tiết hội viên
      description: |
        **Quyền:** STAFF, ADMIN; TRAINER chỉ hội viên mình phụ trách · **UC19, UC28**

        - Kèm các gói `ACTIVE` và `FROZEN` (`subscriptions`) với số buổi PT đã tính sẵn.
        - Kèm lượt đang trong phòng (`currentCheckIn`), nếu có.
        - Không trả `qrToken` (chỉ chủ tài khoản thấy qua `GET /me`).
      responses:
        '200':
          description: Chi tiết hội viên.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemberDetail' }
              examples:
                MemberAnDetail: { $ref: '#/components/examples/MemberAnDetail' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Hội viên]
      operationId: updateMember
      summary: Sửa thông tin hội viên
      description: |
        **Quyền:** STAFF, ADMIN · **UC20**

        Chỉ gửi field muốn đổi. Đổi SĐT thì SĐT mới là định danh đăng nhập mới.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateMemberRequest' }
            example: { phone: '0987654321' }
      responses:
        '200':
          description: Hội viên sau khi sửa.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemberDetail' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: SĐT hoặc email đã được dùng.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                PHONE_DUPLICATED: { $ref: '#/components/examples/ErrPhoneDuplicated' }
                EMAIL_DUPLICATED: { $ref: '#/components/examples/ErrEmailDuplicated' }

  /members/{id}/reset-password:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      tags: [Hội viên]
      operationId: resetMemberPasswordAtDesk
      summary: Đặt lại mật khẩu hoặc kích hoạt tại quầy
      description: |
        **Quyền:** STAFF, ADMIN · **UC04, UC20** · Q15

        Dùng khi khách **không có email** nên không tự đặt lại được.
        1. Staff đối chiếu SĐT với khách tại quầy.
        2. **Khách tự gõ** mật khẩu mới trên máy quầy (Staff không biết mật khẩu, không có mật khẩu tạm).
        3. BE đặt mật khẩu, kích hoạt tài khoản nếu chưa kích hoạt, thu hồi mọi phiên cũ, ghi `audit_logs`.

        **Chờ cập nhật:** endpoint này chưa có trong `docs/spec/api-v3.md` (Huy Trường bổ sung theo Q15).
      x-spec-status: chờ api-v3 (Q15)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeskResetPasswordRequest' }
            example: { newPassword: matkhaumoi456 }
      responses:
        '204':
          description: Đã đặt mật khẩu mới; khách đăng nhập được ngay.
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------------------
  # PT (6)
  # ---------------------------------------------------------------------------
  /trainers:
    get:
      tags: [PT]
      operationId: listTrainers
      summary: Danh sách huấn luyện viên
      description: |
        **Quyền:** Public · **UC21**

        - Khách, hội viên chỉ thấy PT `ACTIVE`. Admin thấy cả `INACTIVE` và lọc được theo `status`.
        - Không trả số điện thoại, email của PT.
        - Sắp xếp: tên A→Z.
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: q
          in: query
          description: Tên PT, không phân biệt dấu và hoa thường.
          schema: { type: string, maxLength: 100 }
        - name: specialty
          in: query
          description: Một chuyên môn, khớp đúng một phần tử trong `specialties`.
          schema: { type: string, maxLength: 50 }
        - name: status
          in: query
          description: Chỉ Admin dùng được.
          schema: { $ref: '#/components/schemas/TrainerStatus' }
      responses:
        '200':
          description: Danh sách PT.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Trainer' }
                  meta: { $ref: '#/components/schemas/PageMeta' }
              examples:
                TrainerCuongList: { $ref: '#/components/examples/TrainerCuongList' }
        '400': { $ref: '#/components/responses/ValidationError' }

  /trainers/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [PT]
      operationId: getTrainer
      summary: Xem hồ sơ PT
      description: |
        **Quyền:** Public · **UC21**

        `id` là `trainers.id`. Hồ sơ PT `INACTIVE` vẫn xem được (mở lại link cũ) nhưng không đặt lịch được.
      security:
        - {}
        - bearerAuth: []
      responses:
        '200':
          description: Hồ sơ PT.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Trainer' }
              examples:
                TrainerCuong: { $ref: '#/components/examples/TrainerCuong' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [PT]
      operationId: updateTrainer
      summary: Sửa hồ sơ, chuyên môn PT hoặc ngừng nhận lịch
      description: |
        **Quyền:** ADMIN · **UC33**

        - Chỉ gửi field muốn đổi. `fullName` lưu ở tài khoản (`users`).
        - `status: INACTIVE`: PT ngừng nhận lịch mới (`POST /appointments` với PT này bị từ chối).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateTrainerRequest' }
            example: { specialties: [Giảm mỡ, Tăng cơ, Yoga], experienceYears: 6 }
      responses:
        '200':
          description: Hồ sơ PT sau khi sửa.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Trainer' }
              examples:
                TrainerCuong: { $ref: '#/components/examples/TrainerCuong' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /trainers/{id}/availability:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [PT]
      operationId: getTrainerAvailability
      summary: Xem khung giờ rảnh của PT
      description: |
        **Quyền:** Public · **UC22, UC23**

        - Không gửi `from` thì lấy hôm nay; không gửi `to` thì lấy `from` + 27 ngày (4 tuần). Khoảng tối đa 35 ngày.
        - `slots`: các khoảng PT nhận lịch. `busy`: các khoảng PT đã bận (lịch CONFIRMED, lớp SCHEDULED), chỉ có giờ,
          không kèm thông tin hội viên. FE làm mờ ô bận khi hội viên chọn giờ.
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/FromDate'
        - $ref: '#/components/parameters/ToDate'
      responses:
        '200':
          description: Khung giờ rảnh và giờ bận trong khoảng.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrainerAvailability' }
              examples:
                TrainerAvailabilityWeek: { $ref: '#/components/examples/TrainerAvailabilityWeek' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [PT]
      operationId: replaceTrainerAvailability
      summary: Thiết lập khung giờ nhận lịch
      description: |
        **Quyền:** TRAINER (của mình), ADMIN · **UC22** · Quyết định 14

        - FE cho PT nhập mẫu theo thứ trong tuần, tự sinh các khoảng cho 4 tuần rồi gọi PUT.
        - BE **thay toàn bộ** khoảng của PT nằm trong `from`..`to` bằng `slots` gửi lên. Ngoài khoảng đó giữ nguyên.
        - Mỗi khoảng phải nằm trong `from`..`to`, `endsAt` sau `startsAt`, các khoảng không chồng nhau;
          sai thì `400 VALIDATION_ERROR` (`details[].field` dạng `slots[3].startsAt`).
        - Đổi khung giờ **không ảnh hưởng** lịch đã có.
        - PT gửi cho `id` của PT khác: `404 NOT_FOUND` (quy ước "của mình").
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReplaceAvailabilityRequest' }
            example:
              from: '2026-11-02'
              to: '2026-11-08'
              slots:
                - { startsAt: '2026-11-02T08:00:00+07:00', endsAt: '2026-11-02T12:00:00+07:00' }
                - { startsAt: '2026-11-04T17:00:00+07:00', endsAt: '2026-11-04T21:00:00+07:00' }
      responses:
        '200':
          description: Khung giờ sau khi thiết lập.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrainerAvailability' }
              examples:
                TrainerAvailabilityWeek: { $ref: '#/components/examples/TrainerAvailabilityWeek' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /trainers/{id}/members:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [PT]
      operationId: listTrainerMembers
      summary: Hội viên PT đang phụ trách
      description: |
        **Quyền:** TRAINER (của mình), ADMIN · **UC28**

        - Hội viên có lịch PENDING, CONFIRMED hoặc COMPLETED với PT này (quyết định 16).
        - Kèm các gói PT `ACTIVE`, `FROZEN` của hội viên với số buổi tính sẵn, và giờ buổi tập sắp tới với PT này.
        - PT gọi `id` của PT khác: `404 NOT_FOUND` (quy ước "của mình").
        - Sắp xếp: buổi sắp tới gần nhất trước; hội viên không có buổi sắp tới xếp sau.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: q
          in: query
          description: Tên (không dấu), SĐT hoặc mã hội viên.
          schema: { type: string, maxLength: 100 }
      responses:
        '200':
          description: Danh sách hội viên phụ trách.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/TrainerMember' }
                  meta: { $ref: '#/components/schemas/PageMeta' }
              examples:
                TrainerMemberList: { $ref: '#/components/examples/TrainerMemberList' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------------------
  # LỊCH PT (7)
  # ---------------------------------------------------------------------------
  /appointments:
    post:
      tags: [Lịch PT]
      operationId: createAppointment
      summary: Đề xuất lịch tập PT
      description: |
        **Quyền:** MEMBER (gói của mình), STAFF, ADMIN (đề xuất hộ hội viên) · **UC23**

        - Tạo lịch `PENDING` kèm đề xuất `INITIAL` đang `OPEN`, chờ PT trả lời (`awaitingRole = TRAINER`).
          Staff đề xuất hộ thì đề xuất ghi là của bên hội viên (`proposedRole = MEMBER`).
        - `endsAt` = `startsAt` + số phút mỗi buổi của gói (BE tính).
        - Điều kiện, sai thì `400 VALIDATION_ERROR`: gói là gói PT `ACTIVE` của hội viên (`subscriptionId`);
          PT đang `ACTIVE` (`trainerId`); `startsAt` ở tương lai. **Chưa chốt (Q21):** có cần mã lỗi riêng cho hai điều kiện đầu.
        - Hết buổi có thể đặt: `422 NO_SESSIONS_AVAILABLE`. Giờ nằm ngoài `startsOn`..`endsOn` của gói:
          `422 OUTSIDE_SUBSCRIPTION_PERIOD`.
        - Trùng lịch CONFIRMED của PT hoặc hội viên, hoặc trùng lớp của PT: `409 SCHEDULE_CONFLICT`.
          BE kiểm lại lần quyết định khi đồng ý (`/accept`).
        - Gửi thông báo cho PT.

        **Chưa chốt (Q20):** giờ đề xuất có bắt buộc nằm trong khung rảnh của PT không. Trong lúc chờ, BE không chặn;
        FE cho chọn giờ từ `GET /trainers/{id}/availability`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAppointmentRequest' }
            example:
              subscriptionId: bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbc
              trainerId: 66666666-6666-4666-8666-666666666666
              startsAt: '2026-11-04T18:00:00+07:00'
              note: Muốn tập chân
      responses:
        '201':
          description: Đã tạo lịch, chờ PT trả lời.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppointmentDetail' }
              examples:
                AppointmentPending: { $ref: '#/components/examples/AppointmentPending' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Trùng lịch.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                SCHEDULE_CONFLICT: { $ref: '#/components/examples/ErrScheduleConflict' }
        '422':
          description: Hết buổi có thể đặt hoặc giờ ngoài thời hạn gói.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                NO_SESSIONS_AVAILABLE: { $ref: '#/components/examples/ErrNoSessionsAvailable' }
                OUTSIDE_SUBSCRIPTION_PERIOD: { $ref: '#/components/examples/ErrOutsideSubscriptionPeriod' }
    get:
      tags: [Lịch PT]
      operationId: listAppointments
      summary: Xem lịch PT (ngày, tuần, tháng)
      description: |
        **Quyền:** MEMBER (lịch của mình), TRAINER (lịch của mình), STAFF, ADMIN · **UC26**

        - MEMBER chỉ thấy lịch của mình (`memberId` bị bỏ qua); TRAINER chỉ thấy lịch của mình (`trainerId` bị bỏ qua).
        - `from`, `to` lọc theo ngày của `startsAt`. Lịch FullCalendar nên gửi đúng khoảng đang xem.
        - Mỗi dòng có `allowedActions` của người gọi, nên lọc "yêu cầu đang chờ tôi" bằng
          `status=PENDING` rồi xem dòng nào có `ACCEPT`.
        - Sắp xếp: `startsAt` sớm nhất trước.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/FromDate'
        - $ref: '#/components/parameters/ToDate'
        - name: status
          in: query
          style: form
          explode: true
          description: Một hoặc nhiều trạng thái.
          schema:
            type: array
            items: { $ref: '#/components/schemas/AppointmentStatus' }
        - $ref: '#/components/parameters/MemberIdQuery'
        - name: trainerId
          in: query
          description: Lọc theo PT (`trainers.id`). TRAINER bị bỏ qua.
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Danh sách lịch.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Appointment' }
                  meta: { $ref: '#/components/schemas/PageMeta' }
              examples:
                AppointmentConfirmedList: { $ref: '#/components/examples/AppointmentConfirmedList' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /appointments/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Lịch PT]
      operationId: getAppointment
      summary: Xem chi tiết lịch (lịch sử đề xuất, hành động được phép)
      description: |
        **Quyền:** MEMBER, TRAINER (lịch của mình), STAFF, ADMIN · **UC24–UC26**

        - `proposals`: mọi đề xuất của lịch, cũ nhất trước (FE vẽ dòng thời gian).
        - `allowedActions` tính cho người gọi:

        | Tình huống | Ai | allowedActions |
        | --- | --- | --- |
        | PENDING | Bên đang được hỏi | `ACCEPT`, `REJECT`, `COUNTER` |
        | CONFIRMED, chưa tới giờ bắt đầu (Chưa chốt Q20e), không có đề xuất OPEN | Hội viên hoặc PT của lịch | `RESCHEDULE`, `CANCEL` |
        | CONFIRMED, có đề xuất RESCHEDULE/CANCEL đang OPEN | Bên đang được hỏi | `ACCEPT`, `REJECT` |
        | CONFIRMED, đã qua giờ kết thúc | PT của lịch, ADMIN | `COMPLETE` |
        | Còn lại (gồm STAFF) | | `[]` |
      responses:
        '200':
          description: Chi tiết lịch.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppointmentDetail' }
              examples:
                pending: { $ref: '#/components/examples/AppointmentPending' }
                confirmed: { $ref: '#/components/examples/AppointmentConfirmed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /appointments/{id}/proposals:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      tags: [Lịch PT]
      operationId: createAppointmentProposal
      summary: Đề xuất giờ khác, xin đổi hoặc xin hủy lịch
      description: |
        **Quyền:** hội viên hoặc PT của lịch, khi hành động có trong `allowedActions` · **UC24, UC25**

        - `COUNTER` (lịch PENDING, bên đang được hỏi): đề xuất OPEN cũ → `SUPERSEDED`, đề xuất mới OPEN,
          `awaitingRole` đổi sang bên kia.
        - `RESCHEDULE` (lịch CONFIRMED): xin đổi sang `startsAt` mới. Lịch giữ giờ cũ đến khi bên kia đồng ý.
        - `CANCEL` (lịch CONFIRMED): xin hủy, không gửi `startsAt`. Lịch giữ nguyên đến khi bên kia đồng ý.
        - `COUNTER`, `RESCHEDULE` bắt buộc `startsAt`; `endsAt` BE tính theo số phút mỗi buổi. Giờ mới ngoài thời hạn gói:
          `422 OUTSIDE_SUBSCRIPTION_PERIOD`; trùng lịch: `409 SCHEDULE_CONFLICT`.
        - Thứ tự kiểm: `expectedVersion` lệch → `409 STALE_VERSION`; hành động không có trong `allowedActions` →
          `403 FORBIDDEN`.
        - Thành công: `version + 1`, thông báo cho bên kia.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateProposalRequest' }
            examples:
              counter:
                summary: PT đề xuất giờ khác
                value: { kind: COUNTER, startsAt: '2026-11-04T19:00:00+07:00', note: 18h tôi kín lịch, expectedVersion: 1 }
              reschedule:
                summary: Hội viên xin đổi giờ lịch đã chốt
                value: { kind: RESCHEDULE, startsAt: '2026-11-06T18:00:00+07:00', expectedVersion: 2 }
              cancel:
                summary: Xin hủy lịch đã chốt
                value: { kind: CANCEL, note: Bị ốm, expectedVersion: 2 }
      responses:
        '201':
          description: Đã gửi đề xuất; trả lịch sau khi cập nhật.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppointmentDetail' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Lịch vừa bị bên kia cập nhật, hoặc giờ mới bị trùng.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                STALE_VERSION: { $ref: '#/components/examples/ErrStaleVersion' }
                SCHEDULE_CONFLICT: { $ref: '#/components/examples/ErrScheduleConflict' }
        '422':
          description: Giờ mới ngoài thời hạn gói.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                OUTSIDE_SUBSCRIPTION_PERIOD: { $ref: '#/components/examples/ErrOutsideSubscriptionPeriod' }

  /appointments/{id}/accept:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      tags: [Lịch PT]
      operationId: acceptAppointmentProposal
      summary: Đồng ý đề xuất đang mở
      description: |
        **Quyền:** bên đang được hỏi (`allowedActions` có `ACCEPT`) · **UC24, UC25**

        - Áp dụng đề xuất OPEN theo bảng ở tag "Lịch PT".
        - Với INITIAL, COUNTER, RESCHEDULE: BE khóa dòng PT (`FOR UPDATE`), kiểm trùng lịch CONFIRMED của PT, của hội viên
          và lớp của PT (`409 SCHEDULE_CONFLICT`), kiểm lại số buổi (`422 NO_SESSIONS_AVAILABLE`).
        - Thứ tự kiểm: `409 STALE_VERSION` → `403 FORBIDDEN` → trùng lịch, số buổi.
        - Thành công: `version + 1`, thông báo cho bên kia.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VersionedActionRequest' }
            example: { expectedVersion: 1 }
      responses:
        '200':
          description: Lịch sau khi đồng ý.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppointmentDetail' }
              examples:
                AppointmentConfirmed: { $ref: '#/components/examples/AppointmentConfirmed' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Lịch vừa bị cập nhật, hoặc giờ bị trùng.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                STALE_VERSION: { $ref: '#/components/examples/ErrStaleVersion' }
                SCHEDULE_CONFLICT: { $ref: '#/components/examples/ErrScheduleConflict' }
        '422':
          description: Gói đã hết buổi có thể đặt.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                NO_SESSIONS_AVAILABLE: { $ref: '#/components/examples/ErrNoSessionsAvailable' }

  /appointments/{id}/reject:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      tags: [Lịch PT]
      operationId: rejectAppointmentProposal
      summary: Từ chối đề xuất đang mở
      description: |
        **Quyền:** bên đang được hỏi (`allowedActions` có `REJECT`) · **UC24, UC25**

        - Bắt buộc `reason` (be-plan tuần 5: "reject có lý do"; lưu vào `rejectReason` của đề xuất).
        - Từ chối INITIAL/COUNTER: lịch `REJECTED`, nhả buổi đang giữ. Từ chối RESCHEDULE/CANCEL: lịch giữ nguyên.
        - Thứ tự kiểm: `409 STALE_VERSION` → `403 FORBIDDEN`. Thành công: `version + 1`, thông báo cho bên kia.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RejectProposalRequest' }
            example: { expectedVersion: 1, reason: Tuần này tôi nghỉ phép }
      responses:
        '200':
          description: Lịch sau khi từ chối.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppointmentDetail' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Lịch vừa bị cập nhật.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                STALE_VERSION: { $ref: '#/components/examples/ErrStaleVersion' }

  /appointments/{id}/complete:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      tags: [Lịch PT]
      operationId: completeAppointment
      summary: Xác nhận buổi đã tập hoặc vắng
      description: |
        **Quyền:** PT của lịch, ADMIN · **UC27** · Quyết định 3

        - Chỉ lịch `CONFIRMED` và **đã qua `endsAt`**; chưa tới giờ thì `422 SESSION_NOT_ENDED`.
        - `COMPLETED` (đã tập) hoặc `NO_SHOW` (vắng): **cả hai đều trừ 1 buổi**.
        - Lưu người xác nhận và thời điểm. Đề xuất RESCHEDULE/CANCEL còn OPEN (nếu có) chuyển `SUPERSEDED` (Chưa chốt Q20i).
        - Thứ tự kiểm: `409 STALE_VERSION` → `403 FORBIDDEN` → `422 SESSION_NOT_ENDED`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CompleteAppointmentRequest' }
            example: { result: COMPLETED, expectedVersion: 2, note: 'Tập tốt, tăng tạ squat' }
      responses:
        '200':
          description: Lịch sau khi xác nhận.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppointmentDetail' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Lịch vừa bị cập nhật.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                STALE_VERSION: { $ref: '#/components/examples/ErrStaleVersion' }
        '422':
          description: Buổi tập chưa kết thúc.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                SESSION_NOT_ENDED: { $ref: '#/components/examples/ErrSessionNotEnded' }

  # ---------------------------------------------------------------------------
  # THEO DÕI TẬP (5)
  # ---------------------------------------------------------------------------
  /members/{id}/training-notes:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Theo dõi tập]
      operationId: listTrainingNotes
      summary: Ghi chú tình trạng, tiến độ của hội viên
      description: |
        **Quyền:** MEMBER (của mình), TRAINER (hội viên mình phụ trách), ADMIN · **UC29**

        - `id` là `members.id`. MEMBER gọi `id` của người khác, PT gọi hội viên không phụ trách: `404 NOT_FOUND`.
        - Sắp xếp: mới nhất trước.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: planId
          in: query
          description: Chỉ lấy ghi chú gắn với kế hoạch này.
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Danh sách ghi chú.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/TrainingNote' }
                  meta: { $ref: '#/components/schemas/PageMeta' }
              examples:
                TrainingNoteList: { $ref: '#/components/examples/TrainingNoteList' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Theo dõi tập]
      operationId: createTrainingNote
      summary: Ghi chú tình trạng, cập nhật tiến độ
      description: |
        **Quyền:** TRAINER (hội viên mình phụ trách) · **UC29**

        - `planId` (không bắt buộc) phải là kế hoạch của hội viên này.
        - Có cả `planId` và `progressPercent` thì BE cập nhật luôn `progressPercent` của kế hoạch đó.

        **Chưa chốt (Q20):** Admin có được ghi chú không (api-v3 ghi "Admin" chung cho nhóm). Trong lúc chờ, chỉ PT ghi.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTrainingNoteRequest' }
            example:
              content: Đầu gối trái hơi đau, giảm tạ squat còn 40kg.
              planId: dddddddd-dddd-4ddd-8ddd-dddddddddddd
              progressPercent: 35
      responses:
        '201':
          description: Đã ghi chú.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrainingNote' }
              examples:
                TrainingNote: { $ref: '#/components/examples/TrainingNote' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /members/{id}/training-plans:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Theo dõi tập]
      operationId: listTrainingPlans
      summary: Kế hoạch tập của hội viên
      description: |
        **Quyền:** MEMBER (của mình), TRAINER (hội viên mình phụ trách), ADMIN · **UC30**

        `id` là `members.id`. Sắp xếp: cập nhật gần nhất trước.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Danh sách kế hoạch.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/TrainingPlan' }
                  meta: { $ref: '#/components/schemas/PageMeta' }
              examples:
                TrainingPlanList: { $ref: '#/components/examples/TrainingPlanList' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Theo dõi tập]
      operationId: createTrainingPlan
      summary: Lập kế hoạch tập
      description: |
        **Quyền:** TRAINER (hội viên mình phụ trách) · **UC30**

        Kế hoạch mới có `progressPercent = 0` nếu không gửi. **Chưa chốt (Q20):** Admin có được lập kế hoạch không.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTrainingPlanRequest' }
            example:
              title: Giảm 5kg trong 8 tuần
              exercises:
                - { name: Squat, sets: 4, reps: 10, weightKg: 50, durationMinutes: null, note: null }
                - { name: Chạy bộ, sets: null, reps: null, weightKg: null, durationMinutes: 20, note: Nhịp tim 130–150 }
      responses:
        '201':
          description: Đã lập kế hoạch.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrainingPlan' }
              examples:
                TrainingPlan: { $ref: '#/components/examples/TrainingPlan' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /training-plans/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    patch:
      tags: [Theo dõi tập]
      operationId: updateTrainingPlan
      summary: Sửa kế hoạch tập, cập nhật tiến độ
      description: |
        **Quyền:** TRAINER đã lập kế hoạch (và vẫn phụ trách hội viên) · **UC30**

        Chỉ gửi field muốn đổi. Gửi `exercises` là **thay cả danh sách**. **Chưa chốt (Q20h):** Admin có được sửa không.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateTrainingPlanRequest' }
            example: { progressPercent: 50 }
      responses:
        '200':
          description: Kế hoạch sau khi sửa.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrainingPlan' }
              examples:
                TrainingPlan: { $ref: '#/components/examples/TrainingPlan' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------------------
  # TÀI KHOẢN (6)
  # ---------------------------------------------------------------------------
  /users:
    get:
      tags: [Tài khoản]
      operationId: listUsers
      summary: Danh sách tài khoản
      description: |
        **Quyền:** ADMIN · **UC31**

        Mặc định trả mọi vai trò; lọc bằng `role`. Hội viên nên xem ở `GET /members` (có thêm thông tin gói).
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: q
          in: query
          description: Tên (không dấu), SĐT hoặc email.
          schema: { type: string, maxLength: 100 }
        - name: role
          in: query
          schema: { $ref: '#/components/schemas/Role' }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/UserStatus' }
      responses:
        '200':
          description: Danh sách tài khoản.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/User' }
                  meta: { $ref: '#/components/schemas/PageMeta' }
              examples:
                UserTrainerList: { $ref: '#/components/examples/UserTrainerList' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Tài khoản]
      operationId: createUser
      summary: Tạo tài khoản Staff hoặc PT
      description: |
        **Quyền:** ADMIN · **UC32**

        - `role` là `STAFF` hoặc `TRAINER` (UC32). Hội viên tạo ở `POST /members`; muốn có Admin mới thì
          tạo Staff rồi đổi vai trò (`PATCH /users/{id}/role`).
        - Admin đặt mật khẩu ban đầu và báo cho nhân viên; nhân viên tự đổi bằng `POST /auth/change-password`.
        - `TRAINER`: gửi kèm `trainer` (chuyên môn, giới thiệu, kinh nghiệm); BE tạo hồ sơ PT.
        - `STAFF`: có thể gửi `shift` (ca làm).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateUserRequest' }
            example:
              role: TRAINER
              fullName: Lê Minh Cường
              phone: '0900000003'
              email: cuong.pt@example.com
              password: matkhau123
              trainer:
                specialties: [Giảm mỡ, Tăng cơ]
                bio: 5 năm kinh nghiệm huấn luyện thể hình.
                experienceYears: 5
      responses:
        '201':
          description: Đã tạo tài khoản.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
              examples:
                UserTrainer: { $ref: '#/components/examples/UserTrainer' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: SĐT hoặc email đã được dùng.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                PHONE_DUPLICATED: { $ref: '#/components/examples/ErrPhoneDuplicated' }
                EMAIL_DUPLICATED: { $ref: '#/components/examples/ErrEmailDuplicated' }

  /users/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Tài khoản]
      operationId: getUser
      summary: Xem chi tiết tài khoản
      description: |
        **Quyền:** ADMIN · **UC31**
      responses:
        '200':
          description: Chi tiết tài khoản.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
              examples:
                UserTrainer: { $ref: '#/components/examples/UserTrainer' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Tài khoản]
      operationId: updateUser
      summary: Sửa thông tin tài khoản
      description: |
        **Quyền:** ADMIN · **UC33**

        - Chỉ gửi field muốn đổi. `shift` chỉ áp dụng cho STAFF.
        - Chuyên môn, giới thiệu của PT sửa ở `PATCH /trainers/{id}`.
        - Không đổi vai trò, trạng thái ở đây (dùng `/role`, `/status`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateUserRequest' }
            example: { fullName: Lê Minh Cường, shift: Ca sáng }
      responses:
        '200':
          description: Tài khoản sau khi sửa.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: SĐT hoặc email đã được dùng.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                PHONE_DUPLICATED: { $ref: '#/components/examples/ErrPhoneDuplicated' }
                EMAIL_DUPLICATED: { $ref: '#/components/examples/ErrEmailDuplicated' }

  /users/{id}/status:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    patch:
      tags: [Tài khoản]
      operationId: updateUserStatus
      summary: Khóa hoặc mở khóa tài khoản
      description: |
        **Quyền:** ADMIN · **UC34**

        - `LOCKED`: người đó bị đăng xuất khỏi mọi thiết bị ngay (tăng `token_version`) và không đăng nhập được
          (`403 ACCOUNT_LOCKED`).
        - `ACTIVE`: mở khóa.
        - Bắt buộc `reason`. Ghi `audit_logs`.
        - Admin không tự khóa chính mình: `403 FORBIDDEN`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateUserStatusRequest' }
            example: { status: LOCKED, reason: Nghỉ việc từ 01/11 }
      responses:
        '200':
          description: Tài khoản sau khi đổi trạng thái.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /users/{id}/role:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    patch:
      tags: [Tài khoản]
      operationId: updateUserRole
      summary: Đổi vai trò
      description: |
        **Quyền:** ADMIN · **UC35**

        - Chỉ đổi giữa `ADMIN`, `STAFF`, `TRAINER`. Đổi từ hoặc sang `MEMBER`: `422 ROLE_CHANGE_NOT_ALLOWED`.
        - Đổi PT sang vai trò khác khi PT còn lịch hoặc lớp trong tương lai: `422 ROLE_CHANGE_NOT_ALLOWED`.
        - Đổi sang `TRAINER`: BE tạo hồ sơ PT trống (sửa sau ở `PATCH /trainers/{id}`).
        - Người bị đổi vai trò bị đăng xuất khỏi mọi thiết bị. Bắt buộc `reason`. Ghi `audit_logs`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateUserRoleRequest' }
            example: { role: STAFF, reason: Chuyển sang làm quầy }
      responses:
        '200':
          description: Tài khoản sau khi đổi vai trò.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: Không đổi được vai trò cho tài khoản này.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                ROLE_CHANGE_NOT_ALLOWED: { $ref: '#/components/examples/ErrRoleChangeNotAllowed' }

  # ---------------------------------------------------------------------------
  # LỚP HỌC (7)
  # ---------------------------------------------------------------------------
  /classes:
    get:
      tags: [Lớp học]
      operationId: listClasses
      summary: Danh sách lớp
      description: |
        **Quyền:** Public · **UC26, UC37**

        - Không gửi `from` thì lấy từ hôm nay. Khách, hội viên chỉ thấy lớp `SCHEDULED`; Admin thấy cả `CANCELLED`
          và lọc được theo `status`.
        - `trainerId`: lịch dạy lớp của một PT (PT xem cùng lịch PT, UC26).
        - `mine=true`: chỉ lớp hội viên đang đăng ký (màn "Lớp của tôi"); chỉ MEMBER dùng được.
        - Đã đăng nhập bằng MEMBER thì mỗi lớp có `myEnrollment`; người khác là `null`.
        - Sắp xếp: `startsAt` sớm nhất trước.
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/FromDate'
        - $ref: '#/components/parameters/ToDate'
        - name: trainerId
          in: query
          description: Lọc theo PT dạy lớp (`trainers.id`).
          schema: { type: string, format: uuid }
        - name: mine
          in: query
          description: "`true` chỉ lớp tôi đang đăng ký (REGISTERED). Chỉ MEMBER."
          schema: { type: boolean }
        - name: status
          in: query
          description: Chỉ Admin dùng được.
          schema: { $ref: '#/components/schemas/ClassStatus' }
      responses:
        '200':
          description: Danh sách lớp.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/GymClass' }
                  meta: { $ref: '#/components/schemas/PageMeta' }
              examples:
                GymClassYogaList: { $ref: '#/components/examples/GymClassYogaList' }
        '400': { $ref: '#/components/responses/ValidationError' }
    post:
      tags: [Lớp học]
      operationId: createClass
      summary: Tạo lớp
      description: |
        **Quyền:** ADMIN · **UC36** · Quyết định 11, 15

        - Tạo từng buổi; nút "nhân bản sang tuần sau" của FE gọi lại endpoint này với giờ mới.
        - `cancelBeforeMinutes` không gửi thì mặc định 120.
        - PT dạy lớp trùng lịch CONFIRMED hoặc lớp khác của PT đó: `409 SCHEDULE_CONFLICT` (BE khóa dòng PT khi kiểm).
        - PT phải đang `ACTIVE`, `startsAt` ở tương lai, `endsAt` sau `startsAt`; sai thì `400 VALIDATION_ERROR`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateClassRequest' }
            example:
              name: Yoga buổi tối
              description: Yoga cơ bản cho người mới.
              trainerId: 66666666-6666-4666-8666-666666666666
              capacity: 15
              startsAt: '2026-11-05T19:00:00+07:00'
              endsAt: '2026-11-05T20:00:00+07:00'
              cancelBeforeMinutes: 120
      responses:
        '201':
          description: Đã tạo lớp.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GymClass' }
              examples:
                GymClassYoga: { $ref: '#/components/examples/GymClassYoga' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: PT bị trùng lịch.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                SCHEDULE_CONFLICT: { $ref: '#/components/examples/ErrScheduleConflict' }

  /classes/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Lớp học]
      operationId: getClass
      summary: Xem chi tiết lớp
      description: |
        **Quyền:** Public · **UC37**

        `cancelDeadline` (hạn hủy đăng ký) BE tính sẵn từ `startsAt` − `cancelBeforeMinutes`.
      security:
        - {}
        - bearerAuth: []
      responses:
        '200':
          description: Chi tiết lớp.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GymClass' }
              examples:
                GymClassYoga: { $ref: '#/components/examples/GymClassYoga' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Lớp học]
      operationId: updateClass
      summary: Sửa lớp, đổi PT, đổi sức chứa hoặc hủy lớp
      description: |
        **Quyền:** ADMIN · **UC36**

        - Chỉ gửi field muốn đổi. Đổi PT hoặc giờ thì kiểm trùng như khi tạo (`409 SCHEDULE_CONFLICT`).
        - `capacity` không nhỏ hơn số người đang đăng ký: `400 VALIDATION_ERROR` (Chưa chốt Q20i).
        - Hủy lớp: `status: CANCELLED`, gửi thông báo cho người đã đăng ký (be-plan tuần 7). Không mở lại lớp đã hủy,
          tạo lớp mới (Chưa chốt Q20i).

        **Chưa chốt (Q20):** khi hủy lớp, các đăng ký `REGISTERED` giữ nguyên hay chuyển `CANCELLED`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateClassRequest' }
            examples:
              capacity:
                summary: Tăng sức chứa
                value: { capacity: 20 }
              cancel:
                summary: Hủy lớp
                value: { status: CANCELLED }
      responses:
        '200':
          description: Lớp sau khi sửa.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GymClass' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: PT bị trùng lịch.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                SCHEDULE_CONFLICT: { $ref: '#/components/examples/ErrScheduleConflict' }

  /classes/{id}/enrollments:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      tags: [Lớp học]
      operationId: enrollClass
      summary: Đăng ký lớp
      description: |
        **Quyền:** MEMBER · **UC37**

        - Không có body. BE khóa dòng lớp (`FOR UPDATE`) khi kiểm chỗ.
        - Cần gói `ACTIVE` có quyền vào lớp: không có thì `422 NO_CLASS_BENEFIT`.
        - Lớp đủ chỗ: `409 CLASS_FULL`.
        - Đã đăng ký rồi (gửi lặp): trả `200` với đăng ký hiện tại.

        **Chưa chốt (Q21):** mã lỗi khi lớp đã hủy hoặc đã bắt đầu (Hồng Anh bổ sung vào `error-codes.md`).
      responses:
        '200':
          description: Đã đăng ký từ trước.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClassEnrollment' }
        '201':
          description: Đã đăng ký.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClassEnrollment' }
              examples:
                ClassEnrollmentRegistered: { $ref: '#/components/examples/ClassEnrollmentRegistered' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Lớp đã đủ chỗ.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                CLASS_FULL: { $ref: '#/components/examples/ErrClassFull' }
        '422':
          description: Gói không gồm quyền vào lớp.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                NO_CLASS_BENEFIT: { $ref: '#/components/examples/ErrNoClassBenefit' }
    get:
      tags: [Lớp học]
      operationId: listClassEnrollments
      summary: Danh sách đăng ký của lớp
      description: |
        **Quyền:** ADMIN, STAFF, TRAINER dạy lớp này · **UC38**

        - PT không dạy lớp này: `404 NOT_FOUND`.
        - Không gửi `status` thì trả cả đăng ký đã hủy. Sắp xếp: đăng ký sớm nhất trước.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/EnrollmentStatus' }
      responses:
        '200':
          description: Danh sách đăng ký.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ClassEnrollment' }
                  meta: { $ref: '#/components/schemas/PageMeta' }
              examples:
                ClassEnrollmentList: { $ref: '#/components/examples/ClassEnrollmentList' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /classes/{id}/enrollments/me:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    delete:
      tags: [Lớp học]
      operationId: cancelMyClassEnrollment
      summary: Hủy đăng ký lớp của tôi
      description: |
        **Quyền:** MEMBER · **UC37**

        - Chỉ hủy trước `cancelDeadline` của lớp; quá hạn thì `422 CANCELLATION_WINDOW_PASSED`.
        - Không có đăng ký `REGISTERED` ở lớp này: `404 NOT_FOUND`.
        - Hủy rồi đăng ký lại thì tạo đăng ký mới.
      responses:
        '204':
          description: Đã hủy đăng ký.
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: Đã quá hạn hủy.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                CANCELLATION_WINDOW_PASSED: { $ref: '#/components/examples/ErrCancellationWindowPassed' }

  # ---------------------------------------------------------------------------
  # BÁO CÁO (4)
  # ---------------------------------------------------------------------------
  /reports/overview:
    get:
      tags: [Báo cáo]
      operationId: getReportOverview
      summary: Thống kê tổng quan
      description: |
        **Quyền:** ADMIN · **UC40**

        - Không gửi `from`, `to` thì lấy tháng hiện tại.
        - `totalMembers`: số hội viên có gói ACTIVE **hôm nay** (không phụ thuộc khoảng ngày).
        - `expiringSoon`: số gói ACTIVE hết hạn trong 7 ngày tới, tính từ hôm nay.
        - `newMembers`, `checkIns`, `popularPackages` tính trong `from`..`to`. `popularPackages`: tối đa 5 gói nhiều đơn PAID nhất.

        **Chưa chốt (Q20):** "hội viên mới" tính theo đơn PAID đầu tiên trong khoảng hay theo ngày tạo tài khoản.
      parameters:
        - $ref: '#/components/parameters/FromDate'
        - $ref: '#/components/parameters/ToDate'
      responses:
        '200':
          description: Số liệu tổng quan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportOverview' }
              examples:
                ReportOverviewOctober: { $ref: '#/components/examples/ReportOverviewOctober' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /reports/revenue:
    get:
      tags: [Báo cáo]
      operationId: getReportRevenue
      summary: Báo cáo doanh thu theo ngày, tháng, năm và theo gói
      description: |
        **Quyền:** ADMIN · **UC39** · Quyết định 19

        - Doanh thu = tổng `amount` của payment `SUCCESS`, theo ngày `paidAt` (giờ Việt Nam).
        - Không gửi `from`, `to` thì lấy tháng hiện tại. `groupBy` mặc định `DAY`.
        - `series` có đủ mọi kỳ trong khoảng, kỳ không có doanh thu là 0. `period` dạng `YYYY-MM-DD` (DAY),
          `YYYY-MM` (MONTH), `YYYY` (YEAR).
      parameters:
        - $ref: '#/components/parameters/FromDate'
        - $ref: '#/components/parameters/ToDate'
        - name: groupBy
          in: query
          schema: { $ref: '#/components/schemas/ReportGroupBy' }
      responses:
        '200':
          description: Doanh thu.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RevenueReport' }
              examples:
                RevenueReportByMonth: { $ref: '#/components/examples/RevenueReportByMonth' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /reports/expiring-subscriptions:
    get:
      tags: [Báo cáo]
      operationId: listExpiringSubscriptions
      summary: Gói sắp hết hạn
      description: |
        **Quyền:** ADMIN · **UC40**

        Gói `ACTIVE` có `endsOn` trong `days` ngày tới (tính cả hôm nay), mặc định 7. Sắp xếp: hết hạn sớm nhất trước.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: days
          in: query
          description: Số ngày tới.
          schema: { type: integer, minimum: 1, maximum: 90, default: 7 }
      responses:
        '200':
          description: Danh sách gói sắp hết hạn.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Subscription' }
                  meta: { $ref: '#/components/schemas/PageMeta' }
              examples:
                SubscriptionPtList: { $ref: '#/components/examples/SubscriptionPtList' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /reports/export:
    get:
      tags: [Báo cáo]
      operationId: exportReport
      summary: Xuất báo cáo Excel
      description: |
        **Quyền:** ADMIN · **UC41**

        - `report` chọn báo cáo; các tham số khác giống endpoint báo cáo tương ứng.
        - Trả file `.xlsx`. FE tải bằng `fetch` (kèm header `Authorization`) rồi lưu blob; tên file lấy từ
          header `Content-Disposition`.
        - Tên cột trong file bằng tiếng Việt (quyết định 18).
      parameters:
        - name: report
          in: query
          required: true
          schema:
            type: string
            enum: [overview, revenue, expiring-subscriptions]
        - $ref: '#/components/parameters/FromDate'
        - $ref: '#/components/parameters/ToDate'
        - name: groupBy
          in: query
          description: Chỉ dùng với `report=revenue`.
          schema: { $ref: '#/components/schemas/ReportGroupBy' }
        - name: days
          in: query
          description: Chỉ dùng với `report=expiring-subscriptions`.
          schema: { type: integer, minimum: 1, maximum: 90, default: 7 }
      responses:
        '200':
          description: File Excel.
          headers:
            Content-Disposition:
              description: Tên file, ví dụ `attachment; filename="doanh-thu_2026-10-01_2026-10-31.xlsx"`.
              schema: { type: string }
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ---------------------------------------------------------------------------
  # THÔNG BÁO (3)
  # ---------------------------------------------------------------------------
  /notifications:
    get:
      tags: [Thông báo]
      operationId: listNotifications
      summary: Thông báo của tôi
      description: |
        **Quyền:** Đã đăng nhập (của mình) · **UC42**

        - `meta.unreadCount`: tổng số chưa đọc (không phụ thuộc bộ lọc), dùng cho số trên chuông.
        - Sắp xếp: mới nhất trước.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: isRead
          in: query
          description: "`false` chỉ lấy thông báo chưa đọc."
          schema: { type: boolean }
      responses:
        '200':
          description: Danh sách thông báo.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Notification' }
                  meta: { $ref: '#/components/schemas/NotificationPageMeta' }
              examples:
                NotificationList: { $ref: '#/components/examples/NotificationList' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /notifications/{id}/read:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    patch:
      tags: [Thông báo]
      operationId: markNotificationRead
      summary: Đánh dấu đã đọc
      description: |
        **Quyền:** Đã đăng nhập (thông báo của mình) · **UC42**

        Không có body. Gửi lặp khi đã đọc: trả `200` với thông báo hiện tại.
      responses:
        '200':
          description: Thông báo sau khi đánh dấu.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Notification' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /notifications/broadcast:
    post:
      tags: [Thông báo]
      operationId: broadcastNotification
      summary: Gửi thông báo chủ động
      description: |
        **Quyền:** ADMIN · **UC43** · Quyết định 2 (chỉ trong ứng dụng)

        - Gửi cho mọi tài khoản `ACTIVE` thuộc các vai trò trong `roles`.
        - Trả số người nhận.

        **Chưa chốt (Q20):** chọn người nhận theo vai trò, hay cần thêm nhóm "hội viên có gói ACTIVE".
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BroadcastRequest' }
            example:
              title: Nghỉ lễ 20/11
              body: Phòng tập đóng cửa ngày 20/11. Chúc quý hội viên ngày lễ vui vẻ.
              roles: [MEMBER]
      responses:
        '202':
          description: Đã tạo thông báo cho người nhận.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BroadcastResponse' }
              example: { recipientCount: 30 }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ---------------------------------------------------------------------------
  # VẬN HÀNH (1)
  # ---------------------------------------------------------------------------
  /health:
    get:
      tags: [Vận hành]
      operationId: health
      summary: Kiểm tra server còn chạy
      description: "**Quyền:** Public"
      security: []
      responses:
        '200':
          description: Server đang chạy.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [ok] }
              example: { status: ok }

# =============================================================================
# COMPONENTS
# =============================================================================
components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token từ `/auth/login` hoặc `/auth/refresh`, hạn 15 phút.
    refreshCookie:
      type: apiKey
      in: cookie
      name: refresh_token
      description: "Cookie HttpOnly do BE đặt. FE không đọc được, chỉ cần gọi với `credentials: 'include'`."

  headers:
    SetRefreshCookie:
      description: Đặt cookie refresh (HttpOnly, SameSite=Lax, path /api/v1/auth).
      schema:
        type: string
        examples: ['refresh_token=eyJhbGciOi...; Path=/api/v1/auth; HttpOnly; SameSite=Lax; Max-Age=604800']
    ClearRefreshCookie:
      description: Xóa cookie refresh.
      schema:
        type: string
        examples: ['refresh_token=; Path=/api/v1/auth; HttpOnly; SameSite=Lax; Max-Age=0']

  # ---------------------------------------------------------------------------
  # Tham số dùng chung
  # ---------------------------------------------------------------------------
  parameters:
    IdPath:
      name: id
      in: path
      required: true
      description: Mã UUID của tài nguyên.
      schema: { type: string, format: uuid }
    Page:
      name: page
      in: query
      description: Trang, bắt đầu từ 1.
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      description: Số dòng mỗi trang.
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    FromDate:
      name: from
      in: query
      description: Từ ngày (tính cả ngày này), giờ Việt Nam.
      schema: { type: string, format: date }
    ToDate:
      name: to
      in: query
      description: Đến ngày (tính cả ngày này), giờ Việt Nam.
      schema: { type: string, format: date }
    MemberIdQuery:
      name: memberId
      in: query
      description: Lọc theo hội viên (`members.id`). Chỉ STAFF, ADMIN dùng; MEMBER bị bỏ qua.
      schema: { type: string, format: uuid }

  # ---------------------------------------------------------------------------
  # Response lỗi dùng chung
  # ---------------------------------------------------------------------------
  responses:
    ValidationError:
      description: Dữ liệu gửi lên sai hoặc thiếu (`VALIDATION_ERROR`). `details` liệt kê từng field sai.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          examples:
            VALIDATION_ERROR: { $ref: '#/components/examples/ErrValidation' }
    Unauthenticated:
      description: Chưa đăng nhập hoặc access token hết hạn (`UNAUTHENTICATED`). FE gọi `/auth/refresh` rồi thử lại.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          examples:
            UNAUTHENTICATED: { $ref: '#/components/examples/ErrUnauthenticated' }
    Forbidden:
      description: Sai vai trò (`FORBIDDEN`).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          examples:
            FORBIDDEN: { $ref: '#/components/examples/ErrForbidden' }
    NotFound:
      description: Không có tài nguyên, hoặc có nhưng không thuộc quyền của bạn (`NOT_FOUND`).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          examples:
            NOT_FOUND: { $ref: '#/components/examples/ErrNotFound' }
    RateLimited:
      description: Gọi quá nhiều lần (`RATE_LIMITED`). `details.retryAfterSeconds` là số giây cần chờ.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          examples:
            RATE_LIMITED: { $ref: '#/components/examples/ErrRateLimited' }

  # ---------------------------------------------------------------------------
  # Schema
  # ---------------------------------------------------------------------------
  schemas:

    # ----- Kiểu cơ bản -----
    Money:
      type: integer
      minimum: 0
      description: Số tiền VND, số nguyên.
      examples: [500000]
    Phone:
      type: string
      pattern: '^0[0-9]{9}$'
      description: Số điện thoại Việt Nam 10 số, bắt đầu bằng 0.
      examples: ['0901234567']
    Password:
      type: string
      minLength: 8
      maxLength: 72
      description: Mật khẩu, 8 đến 72 ký tự.
      examples: [matkhau123]
    DateOnly:
      type: string
      format: date
      description: Ngày thuần theo giờ Việt Nam, `YYYY-MM-DD`.
      examples: ['2026-10-08']
    DateTime:
      type: string
      format: date-time
      description: Thời điểm ISO 8601 có múi giờ `+07:00`.
      examples: ['2026-10-08T09:30:00+07:00']

    # ----- Danh mục giá trị (enum) -----
    Role:
      type: string
      enum: [ADMIN, STAFF, TRAINER, MEMBER]
      description: ADMIN quản trị · STAFF nhân viên quầy · TRAINER huấn luyện viên (PT) · MEMBER khách hàng/hội viên.
    UserStatus:
      type: string
      enum: [ACTIVE, LOCKED]
      description: ACTIVE đang dùng · LOCKED bị Admin khóa.
    TrainerStatus:
      type: string
      enum: [ACTIVE, INACTIVE]
      description: ACTIVE đang nhận lịch · INACTIVE ngừng nhận lịch.
    PackageType:
      type: string
      enum: [GYM, PT]
      description: GYM gói tập tự do · PT gói tập với huấn luyện viên (có số buổi).
    PackageStatus:
      type: string
      enum: [ACTIVE, INACTIVE]
      description: ACTIVE đang bán · INACTIVE ngừng bán.
    DurationUnit:
      type: string
      enum: [DAY, MONTH]
      description: Đơn vị thời hạn gói.
    OrderStatus:
      type: string
      enum: [PENDING, PAID, CANCELLED, EXPIRED]
      description: PENDING chờ thanh toán · PAID đã trả · CANCELLED đã hủy · EXPIRED quá hạn thanh toán.
    PaymentMethod:
      type: string
      enum: [VNPAY, CASH]
      description: VNPAY thanh toán online sandbox · CASH tiền mặt tại quầy.
    PaymentStatus:
      type: string
      enum: [PENDING, SUCCESS, FAILED]
      description: PENDING đang chờ · SUCCESS thành công · FAILED thất bại hoặc bị thay bằng lần trả khác.
    SubscriptionStatus:
      type: string
      enum: [ACTIVE, FROZEN, EXPIRED, CANCELLED]
      description: ACTIVE còn hiệu lực · FROZEN đang bảo lưu · EXPIRED hết hạn · CANCELLED Admin hủy.
    CheckInMethod:
      type: string
      enum: [QR, PHONE]
      description: Cách check-in.
    CheckoutType:
      type: string
      enum: [SELF, STAFF, AUTO]
      description: SELF hội viên tự check-out · STAFF nhân viên làm hộ · AUTO job 23:59 tự đóng.
    AppointmentStatus:
      type: string
      enum: [PENDING, CONFIRMED, REJECTED, CANCELLED, COMPLETED, NO_SHOW]
      description: |
        PENDING đang thương lượng · CONFIRMED đã chốt · REJECTED bị từ chối · CANCELLED đã hủy (không trừ buổi) ·
        COMPLETED đã tập · NO_SHOW vắng (vẫn trừ 1 buổi).
    PartyRole:
      type: string
      enum: [MEMBER, TRAINER]
      description: Một trong hai bên của lịch PT.
    ProposalKind:
      type: string
      enum: [INITIAL, COUNTER, RESCHEDULE, CANCEL]
      description: INITIAL yêu cầu đầu · COUNTER đề xuất giờ khác · RESCHEDULE xin đổi lịch đã chốt · CANCEL xin hủy lịch đã chốt.
    ProposalStatus:
      type: string
      enum: [OPEN, ACCEPTED, REJECTED, SUPERSEDED]
      description: OPEN đang chờ trả lời · ACCEPTED được đồng ý · REJECTED bị từ chối · SUPERSEDED bị thay bằng đề xuất khác.
    AppointmentAction:
      type: string
      enum: [ACCEPT, REJECT, COUNTER, RESCHEDULE, CANCEL, COMPLETE]
      description: Hành động người gọi được làm trên lịch; FE hiện nút theo danh sách này.
    ClassStatus:
      type: string
      enum: [SCHEDULED, CANCELLED]
      description: SCHEDULED sắp diễn ra hoặc đã diễn ra · CANCELLED Admin đã hủy.
    EnrollmentStatus:
      type: string
      enum: [REGISTERED, CANCELLED]
      description: REGISTERED đang đăng ký · CANCELLED đã hủy.
    ReportGroupBy:
      type: string
      enum: [DAY, MONTH, YEAR]
      default: DAY
      description: Gộp doanh thu theo ngày, tháng hoặc năm.
    ErrorCode:
      type: string
      description: Mã lỗi. Danh mục, HTTP status và câu hiển thị ở `docs/api/error-codes.md`.
      enum:
        - VALIDATION_ERROR
        - UNAUTHENTICATED
        - FORBIDDEN
        - NOT_FOUND
        - INVALID_CREDENTIALS
        - ACCOUNT_LOCKED
        - ACCOUNT_TEMPORARILY_LOCKED
        - ACTIVATION_REQUIRED
        - PHONE_DUPLICATED
        - EMAIL_DUPLICATED
        - TOKEN_EXPIRED
        - INVALID_FILE
        - PENDING_ORDER_EXISTS
        - CASH_AMOUNT_MISMATCH
        - NO_ACTIVE_SUBSCRIPTION
        - SUBSCRIPTION_EXPIRED
        - SUBSCRIPTION_FROZEN
        - SUBSCRIPTION_NOT_ACTIVE
        - SUBSCRIPTION_NOT_FROZEN
        - ALREADY_CHECKED_IN
        - INVALID_QR
        - FREEZE_BLOCKED_BY_APPOINTMENTS
        - SCHEDULE_CONFLICT
        - STALE_VERSION
        - NO_SESSIONS_AVAILABLE
        - OUTSIDE_SUBSCRIPTION_PERIOD
        - SESSION_NOT_ENDED
        - NO_CLASS_BENEFIT
        - CLASS_FULL
        - CANCELLATION_WINDOW_PASSED
        - ROLE_CHANGE_NOT_ALLOWED
        - RATE_LIMITED
        - INTERNAL_ERROR

    # ----- Lỗi và phân trang -----
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, details, requestId]
          properties:
            code: { $ref: '#/components/schemas/ErrorCode' }
            message:
              type: string
              description: Câu ngắn cho dev đọc. FE không hiển thị, không dựa vào.
            details:
              description: |
                Thông tin thêm, tùy mã lỗi:
                - `VALIDATION_ERROR`: danh sách `{ field, messages }`.
                - `PENDING_ORDER_EXISTS`: `{ orderId }`. `PHONE_DUPLICATED`: `{ memberId }` (nếu có).
                - `ACCOUNT_TEMPORARILY_LOCKED`, `RATE_LIMITED`: `{ retryAfterSeconds }`.
                - `ALREADY_CHECKED_IN`: `{ checkInId }`. `CASH_AMOUNT_MISMATCH`: `{ expectedAmount }`.
                - `FREEZE_BLOCKED_BY_APPOINTMENTS`: `{ appointmentIds }`.
                - Mã khác: `null`.
              oneOf:
                - type: 'null'
                - type: array
                  items: { $ref: '#/components/schemas/FieldError' }
                - type: object
                  additionalProperties: true
            requestId:
              type: string
              description: Mã truy vết, trùng header `X-Request-Id`. FE hiện trong phần chi tiết lỗi.
    FieldError:
      type: object
      required: [field, messages]
      properties:
        field:
          type: string
          description: Tên field sai, dạng đường dẫn (`trainer.bio`).
        messages:
          type: array
          items: { type: string }
    PageMeta:
      type: object
      required: [page, pageSize, total, totalPages]
      properties:
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, minimum: 0, description: Tổng số dòng khớp bộ lọc. }
        totalPages: { type: integer, minimum: 0 }

    # ----- Xác thực -----
    RegisterRequest:
      type: object
      required: [fullName, phone, password]
      properties:
        fullName: { type: string, minLength: 1, maxLength: 100 }
        phone: { $ref: '#/components/schemas/Phone' }
        email:
          type: [string, 'null']
          format: email
          maxLength: 255
          description: Không bắt buộc (Q15). Có email thì tự đặt lại mật khẩu được.
        dob:
          oneOf:
            - $ref: '#/components/schemas/DateOnly'
            - type: 'null'
          description: Ngày sinh, không bắt buộc.
        password: { $ref: '#/components/schemas/Password' }
      additionalProperties: false
    LoginRequest:
      type: object
      required: [phone, password]
      properties:
        phone: { $ref: '#/components/schemas/Phone' }
        password:
          type: string
          minLength: 1
          description: Không kiểm độ dài khi đăng nhập, chỉ so với mật khẩu đã lưu.
      additionalProperties: false
    ForgotPasswordRequest:
      type: object
      required: [phone]
      properties:
        phone: { $ref: '#/components/schemas/Phone' }
      additionalProperties: false
    ResetPasswordRequest:
      type: object
      required: [token, newPassword]
      properties:
        token: { type: string, minLength: 1, description: Lấy từ tham số `token` trên link trong email. }
        newPassword: { $ref: '#/components/schemas/Password' }
      additionalProperties: false
    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string, minLength: 1 }
        newPassword: { $ref: '#/components/schemas/Password' }
      additionalProperties: false
    DeskResetPasswordRequest:
      type: object
      required: [newPassword]
      properties:
        newPassword: { $ref: '#/components/schemas/Password' }
      additionalProperties: false
    AuthSession:
      type: object
      description: Phiên đăng nhập. Cookie refresh đi kèm qua header `Set-Cookie`.
      required: [accessToken, expiresIn, user]
      properties:
        accessToken: { type: string, description: 'JWT, gửi trong header `Authorization: Bearer`.' }
        expiresIn: { type: integer, description: Số giây còn hiệu lực của access token (900 = 15 phút). }
        user: { $ref: '#/components/schemas/SessionUser' }
    SessionUser:
      type: object
      description: Thông tin tối thiểu để FE dựng giao diện theo vai trò. Muốn đủ thì gọi `GET /me`.
      required: [id, fullName, role, phone, email, avatarUrl]
      properties:
        id: { type: string, format: uuid, description: '`users.id`' }
        fullName: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        phone: { $ref: '#/components/schemas/Phone' }
        email: { type: [string, 'null'], format: email }
        avatarUrl: { type: [string, 'null'] }

    # ----- Hồ sơ -----
    Me:
      type: object
      required: [id, fullName, phone, email, dob, avatarUrl, role, status, shift, member, trainer, createdAt]
      properties:
        id: { type: string, format: uuid, description: '`users.id`' }
        fullName: { type: string }
        phone: { $ref: '#/components/schemas/Phone' }
        email: { type: [string, 'null'], format: email }
        dob:
          oneOf:
            - $ref: '#/components/schemas/DateOnly'
            - type: 'null'
        avatarUrl: { type: [string, 'null'] }
        role: { $ref: '#/components/schemas/Role' }
        status: { $ref: '#/components/schemas/UserStatus' }
        shift: { type: [string, 'null'], description: 'Ca làm, chỉ STAFF có.' }
        member:
          description: Chỉ MEMBER có; vai trò khác là `null`.
          oneOf:
            - $ref: '#/components/schemas/MyMemberProfile'
            - type: 'null'
        trainer:
          description: Chỉ TRAINER có; vai trò khác là `null`.
          oneOf:
            - $ref: '#/components/schemas/TrainerProfile'
            - type: 'null'
        createdAt: { $ref: '#/components/schemas/DateTime' }
    MyMemberProfile:
      type: object
      required: [id, memberCode, qrToken, hasActiveSubscription]
      properties:
        id: { type: string, format: uuid, description: '`members.id`' }
        memberCode: { type: string, description: Mã hội viên in trên thẻ. }
        qrToken: { type: string, description: Nội dung FE dùng để vẽ mã QR. Chỉ chủ tài khoản thấy. }
        hasActiveSubscription:
          type: boolean
          description: "`true` là hội viên (có gói ACTIVE); `false` là khách hàng."
    TrainerProfile:
      type: object
      required: [id, specialties, bio, experienceYears, status]
      properties:
        id: { type: string, format: uuid, description: '`trainers.id`' }
        specialties: { type: array, items: { type: string } }
        bio: { type: [string, 'null'] }
        experienceYears: { type: [integer, 'null'], minimum: 0 }
        status: { $ref: '#/components/schemas/TrainerStatus' }
    UpdateMeRequest:
      type: object
      minProperties: 1
      properties:
        fullName: { type: string, minLength: 1, maxLength: 100 }
        email: { type: [string, 'null'], format: email, maxLength: 255 }
        dob:
          oneOf:
            - $ref: '#/components/schemas/DateOnly'
            - type: 'null'
        avatarUrl: { type: [string, 'null'], description: Lấy từ `POST /uploads/avatar`; `null` để bỏ ảnh. }
        trainer:
          type: object
          description: Chỉ TRAINER gửi.
          minProperties: 1
          properties:
            specialties: { type: array, items: { type: string, maxLength: 50 }, maxItems: 10 }
            bio: { type: [string, 'null'], maxLength: 1000 }
            experienceYears: { type: [integer, 'null'], minimum: 0, maximum: 60 }
          additionalProperties: false
      additionalProperties: false
    QrTokenResponse:
      type: object
      required: [qrToken]
      properties:
        qrToken: { type: string }
    AvatarUploadResponse:
      type: object
      required: [avatarUrl]
      properties:
        avatarUrl: { type: string }

    # ----- Gói -----
    Package:
      type: object
      required: [id, name, description, type, price, durationValue, durationUnit, totalSessions, sessionMinutes, includesClass, benefits, status]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: [string, 'null'] }
        type: { $ref: '#/components/schemas/PackageType' }
        price: { $ref: '#/components/schemas/Money' }
        durationValue: { type: integer, minimum: 1, description: 'Thời hạn, ví dụ 3 (kèm durationUnit MONTH = 3 tháng).' }
        durationUnit: { $ref: '#/components/schemas/DurationUnit' }
        totalSessions: { type: [integer, 'null'], minimum: 1, description: Số buổi PT. `null` với gói GYM. }
        sessionMinutes: { type: [integer, 'null'], minimum: 15, description: Số phút mỗi buổi PT. `null` với gói GYM. }
        includesClass: { type: boolean, description: Có quyền tham gia lớp nhóm. }
        benefits: { type: array, items: { type: string }, description: Danh sách quyền lợi để hiển thị. }
        status: { $ref: '#/components/schemas/PackageStatus' }
    CreatePackageRequest:
      type: object
      required: [name, type, price, durationValue, durationUnit, includesClass]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: [string, 'null'], maxLength: 2000 }
        type: { $ref: '#/components/schemas/PackageType' }
        price: { $ref: '#/components/schemas/Money' }
        durationValue: { type: integer, minimum: 1 }
        durationUnit: { $ref: '#/components/schemas/DurationUnit' }
        totalSessions: { type: [integer, 'null'], minimum: 1, description: Bắt buộc với PT. }
        sessionMinutes: { type: [integer, 'null'], minimum: 15, description: Bắt buộc với PT. }
        includesClass: { type: boolean }
        benefits: { type: array, items: { type: string, maxLength: 200 }, maxItems: 20, default: [] }
      additionalProperties: false
    UpdatePackageRequest:
      type: object
      minProperties: 1
      description: Như CreatePackageRequest nhưng mọi field đều không bắt buộc, không có `type`, thêm `status`.
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: [string, 'null'], maxLength: 2000 }
        price: { $ref: '#/components/schemas/Money' }
        durationValue: { type: integer, minimum: 1 }
        durationUnit: { $ref: '#/components/schemas/DurationUnit' }
        totalSessions: { type: [integer, 'null'], minimum: 1 }
        sessionMinutes: { type: [integer, 'null'], minimum: 15 }
        includesClass: { type: boolean }
        benefits: { type: array, items: { type: string, maxLength: 200 }, maxItems: 20 }
        status: { $ref: '#/components/schemas/PackageStatus' }
      additionalProperties: false

    # ----- Đơn hàng -----
    OrderRequest:
      type: object
      required: [packageId]
      description: Dùng cho cả `POST /orders/quote` và `POST /orders`.
      properties:
        packageId: { type: string, format: uuid }
        memberId:
          type: string
          format: uuid
          description: Bắt buộc khi STAFF/ADMIN mua hộ. MEMBER không gửi (BE lấy từ token).
        renewalOf:
          type: string
          format: uuid
          description: Id gói hội viên đang có, khi gia hạn.
        startsOn:
          $ref: '#/components/schemas/DateOnly'
          description: Ngày bắt đầu, không trước hôm nay. Không gửi thì BE tự chọn (xem mô tả endpoint).
      additionalProperties: false
    OrderQuote:
      type: object
      required: [packageId, packageName, type, price, total, durationValue, durationUnit, totalSessions, sessionMinutes, includesClass, startsOn, endsOn, renewalOf]
      properties:
        packageId: { type: string, format: uuid }
        packageName: { type: string }
        type: { $ref: '#/components/schemas/PackageType' }
        price: { $ref: '#/components/schemas/Money' }
        total: { $ref: '#/components/schemas/Money' }
        durationValue: { type: integer }
        durationUnit: { $ref: '#/components/schemas/DurationUnit' }
        totalSessions: { type: [integer, 'null'] }
        sessionMinutes: { type: [integer, 'null'] }
        includesClass: { type: boolean }
        startsOn: { $ref: '#/components/schemas/DateOnly' }
        endsOn:
          $ref: '#/components/schemas/DateOnly'
          description: Ngày cuối cùng còn hiệu lực (tính cả ngày này). BE tính, FE chỉ hiển thị.
        renewalOf: { type: [string, 'null'], format: uuid }
    OrderTerms:
      type: object
      description: Điều khoản gói **chụp lại lúc tạo đơn**. Không đổi khi Admin sửa gói.
      required: [price, durationValue, durationUnit, totalSessions, sessionMinutes, includesClass]
      properties:
        price: { $ref: '#/components/schemas/Money' }
        durationValue: { type: integer }
        durationUnit: { $ref: '#/components/schemas/DurationUnit' }
        totalSessions: { type: [integer, 'null'] }
        sessionMinutes: { type: [integer, 'null'] }
        includesClass: { type: boolean }
    Order:
      type: object
      required: [id, member, package, renewalOf, terms, startsOn, endsOn, total, status, expiresAt, paidAt, receiptNo, subscriptionId, createdBy, createdAt, payments, receipt]
      properties:
        id: { type: string, format: uuid }
        member: { $ref: '#/components/schemas/MemberRef' }
        package: { $ref: '#/components/schemas/PackageRef' }
        renewalOf: { type: [string, 'null'], format: uuid, description: Gói hội viên được gia hạn. }
        terms: { $ref: '#/components/schemas/OrderTerms' }
        startsOn: { $ref: '#/components/schemas/DateOnly' }
        endsOn: { $ref: '#/components/schemas/DateOnly' }
        total: { $ref: '#/components/schemas/Money' }
        status: { $ref: '#/components/schemas/OrderStatus' }
        expiresAt:
          $ref: '#/components/schemas/DateTime'
          description: Hạn thanh toán. Quá hạn thì job chuyển đơn sang EXPIRED.
        paidAt:
          oneOf:
            - $ref: '#/components/schemas/DateTime'
            - type: 'null'
        receiptNo: { type: [string, 'null'], description: 'Số biên lai, có khi PAID.' }
        subscriptionId: { type: [string, 'null'], format: uuid, description: 'Gói hội viên sinh ra, có khi PAID.' }
        createdBy: { $ref: '#/components/schemas/UserRef' }
        createdAt:
          $ref: '#/components/schemas/DateTime'
          description: Cần cột `orders.created_at`, ERD v3 chưa có (Q16).
        payments:
          type: array
          description: Các lần thanh toán của đơn, mới nhất trước.
          items: { $ref: '#/components/schemas/PaymentSummary' }
        receipt:
          description: Biên lai nội bộ, chỉ có khi PAID.
          oneOf:
            - $ref: '#/components/schemas/Receipt'
            - type: 'null'
    Receipt:
      type: object
      description: Đủ thông tin để FE in biên lai bằng trình duyệt (quyết định 7).
      required: [receiptNo, paidAt, memberName, memberCode, memberPhone, packageName, startsOn, endsOn, amount, method, collectedBy]
      properties:
        receiptNo: { type: string }
        paidAt: { $ref: '#/components/schemas/DateTime' }
        memberName: { type: string }
        memberCode: { type: string }
        memberPhone: { $ref: '#/components/schemas/Phone' }
        packageName: { type: string }
        startsOn: { $ref: '#/components/schemas/DateOnly' }
        endsOn: { $ref: '#/components/schemas/DateOnly' }
        amount: { $ref: '#/components/schemas/Money' }
        method: { $ref: '#/components/schemas/PaymentMethod' }
        collectedBy:
          description: Nhân viên thu tiền mặt; `null` với VNPay.
          oneOf:
            - $ref: '#/components/schemas/UserRef'
            - type: 'null'
    CancelOrderRequest:
      type: object
      properties:
        reason: { type: string, maxLength: 500, description: Bắt buộc khi STAFF/ADMIN hủy hộ. }
      additionalProperties: false

    # ----- Thanh toán -----
    CreatePaymentRequest:
      type: object
      required: [method]
      properties:
        method: { $ref: '#/components/schemas/PaymentMethod' }
      additionalProperties: false
    ConfirmCashRequest:
      type: object
      required: [receivedAmount]
      properties:
        receivedAmount:
          $ref: '#/components/schemas/Money'
          description: Số tiền Staff đã nhận, phải bằng số tiền cần thu.
      additionalProperties: false
    PaymentSummary:
      type: object
      required: [id, method, amount, status, paidAt, createdAt]
      properties:
        id: { type: string, format: uuid }
        method: { $ref: '#/components/schemas/PaymentMethod' }
        amount: { $ref: '#/components/schemas/Money' }
        status: { $ref: '#/components/schemas/PaymentStatus' }
        paidAt:
          oneOf:
            - $ref: '#/components/schemas/DateTime'
            - type: 'null'
        createdAt:
          $ref: '#/components/schemas/DateTime'
          description: Cần cột `payments.created_at`, ERD v3 chưa có (Q16).
    Payment:
      type: object
      required: [id, orderId, member, method, amount, status, merchantRef, gatewayTxnId, checkoutUrl, confirmedBy, paidAt, createdAt]
      properties:
        id: { type: string, format: uuid }
        orderId: { type: string, format: uuid }
        member: { $ref: '#/components/schemas/MemberRef' }
        method: { $ref: '#/components/schemas/PaymentMethod' }
        amount: { $ref: '#/components/schemas/Money' }
        status: { $ref: '#/components/schemas/PaymentStatus' }
        merchantRef: { type: string, description: 'Mã giao dịch phía mình, gửi sang VNPay là `vnp_TxnRef`.' }
        gatewayTxnId: { type: [string, 'null'], description: Mã giao dịch phía VNPay. }
        checkoutUrl:
          type: [string, 'null']
          format: uri
          description: Chỉ có ở response tạo payment VNPAY; FE chuyển trình duyệt sang đây. Các chỗ khác là `null`.
        confirmedBy:
          description: Staff xác nhận tiền mặt.
          oneOf:
            - $ref: '#/components/schemas/UserRef'
            - type: 'null'
        paidAt:
          oneOf:
            - $ref: '#/components/schemas/DateTime'
            - type: 'null'
        createdAt:
          $ref: '#/components/schemas/DateTime'
          description: Cần cột `payments.created_at`, ERD v3 chưa có (Q16).
    VnpayIpnResponse:
      type: object
      required: [RspCode, Message]
      description: Định dạng do VNPay quy định (không theo camelCase của hệ thống).
      properties:
        RspCode: { type: string, enum: ['00', '01', '02', '04', '97', '99'] }
        Message: { type: string }

    # ----- Check-in -----
    CreateCheckInRequest:
      type: object
      description: Gửi đúng một trong hai field.
      oneOf:
        - required: [qrToken]
          properties:
            qrToken: { type: string, minLength: 1, description: Nội dung quét từ mã QR. }
          additionalProperties: false
        - required: [phone]
          properties:
            phone: { $ref: '#/components/schemas/Phone' }
          additionalProperties: false
    CheckIn:
      type: object
      required: [id, member, subscription, method, checkedInAt, checkedOutAt, checkoutType, checkedInBy, expiringSoon]
      properties:
        id: { type: string, format: uuid }
        member: { $ref: '#/components/schemas/MemberRef' }
        subscription: { $ref: '#/components/schemas/SubscriptionRef' }
        method: { $ref: '#/components/schemas/CheckInMethod' }
        checkedInAt: { $ref: '#/components/schemas/DateTime' }
        checkedOutAt:
          description: "`null` là đang trong phòng."
          oneOf:
            - $ref: '#/components/schemas/DateTime'
            - type: 'null'
        checkoutType:
          oneOf:
            - $ref: '#/components/schemas/CheckoutType'
            - type: 'null'
        checkedInBy:
          description: Staff đã check-in cho hội viên.
          oneOf:
            - $ref: '#/components/schemas/UserRef'
            - type: 'null'
        expiringSoon:
          type: boolean
          description: Gói dùng để vào còn 7 ngày trở xuống. FE hiện cảnh báo "sắp hết hạn" (UC16).

    # ----- Hội viên -----
    Member:
      type: object
      description: Một dòng trong danh sách hội viên.
      required: [id, userId, memberCode, fullName, phone, email, dob, avatarUrl, accountStatus, accountActivated, hasActiveSubscription, createdAt]
      properties:
        id: { type: string, format: uuid, description: '`members.id`' }
        userId: { type: string, format: uuid, description: '`users.id`' }
        memberCode: { type: string }
        fullName: { type: string }
        phone: { $ref: '#/components/schemas/Phone' }
        email: { type: [string, 'null'], format: email }
        dob:
          oneOf:
            - $ref: '#/components/schemas/DateOnly'
            - type: 'null'
        avatarUrl: { type: [string, 'null'] }
        accountStatus: { $ref: '#/components/schemas/UserStatus' }
        accountActivated:
          type: boolean
          description: "`false` là hồ sơ tạo tại quầy, chưa đặt mật khẩu."
        hasActiveSubscription:
          type: boolean
          description: "`true` là hội viên; `false` là khách hàng."
        createdAt: { $ref: '#/components/schemas/DateTime' }
    MemberDetail:
      allOf:
        - $ref: '#/components/schemas/Member'
        - type: object
          required: [subscriptions, currentCheckIn]
          properties:
            subscriptions:
              type: array
              description: Gói ACTIVE và FROZEN, kết thúc sớm nhất trước.
              items: { $ref: '#/components/schemas/SubscriptionSummary' }
            currentCheckIn:
              description: Lượt đang trong phòng; `null` nếu không ở phòng tập.
              oneOf:
                - $ref: '#/components/schemas/CheckInRef'
                - type: 'null'
    CreateMemberRequest:
      type: object
      required: [fullName, phone]
      properties:
        fullName: { type: string, minLength: 1, maxLength: 100 }
        phone: { $ref: '#/components/schemas/Phone' }
        email: { type: [string, 'null'], format: email, maxLength: 255, description: Không bắt buộc (Q15). }
        dob:
          oneOf:
            - $ref: '#/components/schemas/DateOnly'
            - type: 'null'
      additionalProperties: false
    UpdateMemberRequest:
      type: object
      minProperties: 1
      properties:
        fullName: { type: string, minLength: 1, maxLength: 100 }
        phone: { $ref: '#/components/schemas/Phone' }
        email: { type: [string, 'null'], format: email, maxLength: 255 }
        dob:
          oneOf:
            - $ref: '#/components/schemas/DateOnly'
            - type: 'null'
      additionalProperties: false

    # ----- Gói hội viên -----
    SessionCounts:
      type: object
      description: |
        Số buổi PT, BE tính từ lịch (không lưu cột):
        `used` = COMPLETED + NO_SHOW · `held` = PENDING + CONFIRMED · `remaining` = total − used ·
        `bookable` = remaining − held.
      required: [total, used, held, remaining, bookable]
      properties:
        total: { type: integer, minimum: 0 }
        used: { type: integer, minimum: 0 }
        held: { type: integer, minimum: 0 }
        remaining: { type: integer, minimum: 0 }
        bookable: { type: integer, minimum: 0 }
    SubscriptionSummary:
      type: object
      required: [id, packageName, type, startsOn, endsOn, status, includesClass, sessions]
      properties:
        id: { type: string, format: uuid }
        packageName: { type: string }
        type: { $ref: '#/components/schemas/PackageType' }
        startsOn: { $ref: '#/components/schemas/DateOnly' }
        endsOn: { $ref: '#/components/schemas/DateOnly' }
        status: { $ref: '#/components/schemas/SubscriptionStatus' }
        includesClass: { type: boolean }
        sessions:
          description: Chỉ gói PT có; gói GYM là `null`.
          oneOf:
            - $ref: '#/components/schemas/SessionCounts'
            - type: 'null'
    Subscription:
      type: object
      description: Một gói hội viên (dòng trong danh sách).
      required: [id, member, package, orderId, packageName, type, startsOn, endsOn, daysLeft, status, includesClass, sessionMinutes, sessions, freeze]
      properties:
        id: { type: string, format: uuid }
        member: { $ref: '#/components/schemas/MemberRef' }
        package: { $ref: '#/components/schemas/PackageRef' }
        orderId: { type: string, format: uuid, description: Đơn đã sinh ra gói này. }
        packageName: { type: string, description: 'Tên gói lúc mua (chụp lại, không đổi khi Admin sửa gói).' }
        type: { $ref: '#/components/schemas/PackageType' }
        startsOn: { $ref: '#/components/schemas/DateOnly' }
        endsOn:
          $ref: '#/components/schemas/DateOnly'
          description: Ngày cuối còn hiệu lực (tính cả ngày này), đã cộng ngày bảo lưu nếu có.
        daysLeft:
          type: integer
          minimum: 0
          description: Số ngày từ hôm nay đến `endsOn`, tính cả hai đầu; 0 khi đã qua `endsOn`.
        status: { $ref: '#/components/schemas/SubscriptionStatus' }
        includesClass: { type: boolean }
        sessionMinutes: { type: [integer, 'null'], description: Số phút mỗi buổi PT. `null` với gói GYM. }
        sessions:
          description: Chỉ gói PT có; gói GYM là `null`.
          oneOf:
            - $ref: '#/components/schemas/SessionCounts'
            - type: 'null'
        freeze:
          description: Thông tin bảo lưu; `null` nếu chưa bảo lưu.
          oneOf:
            - $ref: '#/components/schemas/FreezeInfo'
            - type: 'null'
    SubscriptionDetail:
      allOf:
        - $ref: '#/components/schemas/Subscription'
        - type: object
          required: [monthlySessions]
          properties:
            monthlySessions:
              type: array
              description: Số buổi PT theo tháng (UC10). Gói GYM là mảng rỗng.
              items: { $ref: '#/components/schemas/MonthlySessions' }
    MonthlySessions:
      type: object
      required: [month, completed, noShow, upcoming]
      properties:
        month: { type: string, pattern: '^[0-9]{4}-[0-9]{2}$', description: 'Tháng, dạng `YYYY-MM`.', examples: ['2026-10'] }
        completed: { type: integer, minimum: 0, description: Số buổi COMPLETED. }
        noShow: { type: integer, minimum: 0, description: Số buổi NO_SHOW (vẫn trừ buổi). }
        upcoming: { type: integer, minimum: 0, description: Số buổi PENDING + CONFIRMED. }
    FreezeInfo:
      type: object
      required: [frozenFrom, frozenDays, frozenUntil, reason]
      properties:
        frozenFrom: { $ref: '#/components/schemas/DateOnly' }
        frozenDays: { type: integer, minimum: 1, maximum: 30 }
        frozenUntil:
          $ref: '#/components/schemas/DateOnly'
          description: Ngày cuối của kỳ bảo lưu (BE tính).
        reason: { type: string }
    FreezeSubscriptionRequest:
      type: object
      required: [days, reason]
      properties:
        days: { type: integer, minimum: 1, maximum: 30, description: 'Số ngày bảo lưu, tối đa 30.' }
        reason: { type: string, minLength: 1, maxLength: 500 }
      additionalProperties: false

    # ----- PT -----
    Trainer:
      type: object
      description: Hồ sơ PT công khai (không có SĐT, email).
      required: [id, userId, fullName, avatarUrl, specialties, bio, experienceYears, status]
      properties:
        id: { type: string, format: uuid, description: '`trainers.id`' }
        userId: { type: string, format: uuid, description: '`users.id`' }
        fullName: { type: string }
        avatarUrl: { type: [string, 'null'] }
        specialties: { type: array, items: { type: string } }
        bio: { type: [string, 'null'] }
        experienceYears: { type: [integer, 'null'], minimum: 0 }
        status: { $ref: '#/components/schemas/TrainerStatus' }
    UpdateTrainerRequest:
      type: object
      minProperties: 1
      properties:
        fullName: { type: string, minLength: 1, maxLength: 100 }
        specialties: { type: array, items: { type: string, maxLength: 50 }, maxItems: 10 }
        bio: { type: [string, 'null'], maxLength: 1000 }
        experienceYears: { type: [integer, 'null'], minimum: 0, maximum: 60 }
        status: { $ref: '#/components/schemas/TrainerStatus' }
      additionalProperties: false
    TimeRange:
      type: object
      required: [startsAt, endsAt]
      properties:
        startsAt: { $ref: '#/components/schemas/DateTime' }
        endsAt: { $ref: '#/components/schemas/DateTime' }
    AvailabilitySlot:
      allOf:
        - type: object
          required: [id]
          properties:
            id: { type: string, format: uuid }
        - $ref: '#/components/schemas/TimeRange'
    TrainerAvailability:
      type: object
      required: [trainerId, from, to, slots, busy]
      properties:
        trainerId: { type: string, format: uuid }
        from: { $ref: '#/components/schemas/DateOnly' }
        to: { $ref: '#/components/schemas/DateOnly' }
        slots:
          type: array
          description: Khoảng PT nhận lịch, sớm nhất trước.
          items: { $ref: '#/components/schemas/AvailabilitySlot' }
        busy:
          type: array
          description: Khoảng PT đã bận (lịch CONFIRMED, lớp SCHEDULED), không kèm thông tin hội viên.
          items: { $ref: '#/components/schemas/TimeRange' }
    ReplaceAvailabilityRequest:
      type: object
      required: [from, to, slots]
      properties:
        from: { $ref: '#/components/schemas/DateOnly' }
        to: { $ref: '#/components/schemas/DateOnly' }
        slots:
          type: array
          maxItems: 200
          description: Gửi mảng rỗng để xóa hết khung giờ trong khoảng.
          items: { $ref: '#/components/schemas/TimeRange' }
      additionalProperties: false
    TrainerMember:
      type: object
      required: [member, subscriptions, nextAppointmentAt]
      properties:
        member: { $ref: '#/components/schemas/MemberRef' }
        subscriptions:
          type: array
          description: Gói PT ACTIVE và FROZEN của hội viên, kèm số buổi.
          items: { $ref: '#/components/schemas/SubscriptionSummary' }
        nextAppointmentAt:
          description: Giờ bắt đầu buổi PENDING/CONFIRMED sắp tới gần nhất với PT này.
          oneOf:
            - $ref: '#/components/schemas/DateTime'
            - type: 'null'

    # ----- Lịch PT -----
    Appointment:
      type: object
      required: [id, member, trainer, subscription, status, awaitingRole, version, startsAt, endsAt, note, openProposal, completedBy, completedAt, allowedActions]
      properties:
        id: { type: string, format: uuid }
        member: { $ref: '#/components/schemas/MemberRef' }
        trainer: { $ref: '#/components/schemas/TrainerRef' }
        subscription:
          type: object
          required: [id, packageName]
          properties:
            id: { type: string, format: uuid }
            packageName: { type: string }
        status: { $ref: '#/components/schemas/AppointmentStatus' }
        awaitingRole:
          description: Bên đang được hỏi; `null` khi không có đề xuất OPEN.
          oneOf:
            - $ref: '#/components/schemas/PartyRole'
            - type: 'null'
        version: { type: integer, minimum: 1, description: Gửi lại làm `expectedVersion` cho mọi hành động. }
        startsAt: { $ref: '#/components/schemas/DateTime' }
        endsAt: { $ref: '#/components/schemas/DateTime' }
        note: { type: [string, 'null'], description: Ghi chú của lịch (khi tạo hoặc khi PT xác nhận buổi). }
        openProposal:
          description: Đề xuất đang chờ trả lời; `null` nếu không có.
          oneOf:
            - $ref: '#/components/schemas/Proposal'
            - type: 'null'
        completedBy:
          description: Người xác nhận buổi (PT hoặc Admin).
          oneOf:
            - $ref: '#/components/schemas/UserRef'
            - type: 'null'
        completedAt:
          oneOf:
            - $ref: '#/components/schemas/DateTime'
            - type: 'null'
        allowedActions:
          type: array
          description: Hành động người gọi được làm lúc này (bảng ở `GET /appointments/{id}`).
          items: { $ref: '#/components/schemas/AppointmentAction' }
    AppointmentDetail:
      allOf:
        - $ref: '#/components/schemas/Appointment'
        - type: object
          required: [proposals]
          properties:
            proposals:
              type: array
              description: Mọi đề xuất của lịch, cũ nhất trước.
              items: { $ref: '#/components/schemas/Proposal' }
    Proposal:
      type: object
      required: [id, kind, proposedBy, proposedRole, startsAt, endsAt, note, status, rejectReason, createdAt]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: '#/components/schemas/ProposalKind' }
        proposedBy:
          description: Người gửi (có thể là Staff đề xuất hộ hội viên).
          allOf:
            - $ref: '#/components/schemas/UserRef'
        proposedRole: { $ref: '#/components/schemas/PartyRole' }
        startsAt:
          description: Giờ đề xuất; `null` với CANCEL.
          oneOf:
            - $ref: '#/components/schemas/DateTime'
            - type: 'null'
        endsAt:
          oneOf:
            - $ref: '#/components/schemas/DateTime'
            - type: 'null'
        note: { type: [string, 'null'] }
        status: { $ref: '#/components/schemas/ProposalStatus' }
        rejectReason: { type: [string, 'null'] }
        createdAt: { $ref: '#/components/schemas/DateTime' }
    CreateAppointmentRequest:
      type: object
      required: [subscriptionId, trainerId, startsAt]
      properties:
        subscriptionId: { type: string, format: uuid, description: Gói PT ACTIVE dùng buổi. Hội viên suy ra từ gói. }
        trainerId: { type: string, format: uuid, description: '`trainers.id`' }
        startsAt: { $ref: '#/components/schemas/DateTime' }
        note: { type: [string, 'null'], maxLength: 500 }
      additionalProperties: false
    CreateProposalRequest:
      type: object
      required: [kind, expectedVersion]
      properties:
        kind:
          type: string
          enum: [COUNTER, RESCHEDULE, CANCEL]
        startsAt:
          $ref: '#/components/schemas/DateTime'
          description: Bắt buộc với COUNTER, RESCHEDULE; không gửi với CANCEL.
        note: { type: [string, 'null'], maxLength: 500 }
        expectedVersion: { type: integer, minimum: 1 }
      additionalProperties: false
    VersionedActionRequest:
      type: object
      required: [expectedVersion]
      properties:
        expectedVersion: { type: integer, minimum: 1 }
      additionalProperties: false
    RejectProposalRequest:
      type: object
      required: [expectedVersion, reason]
      properties:
        expectedVersion: { type: integer, minimum: 1 }
        reason: { type: string, minLength: 1, maxLength: 500 }
      additionalProperties: false
    CompleteAppointmentRequest:
      type: object
      required: [result, expectedVersion]
      properties:
        result:
          type: string
          enum: [COMPLETED, NO_SHOW]
        note: { type: [string, 'null'], maxLength: 500 }
        expectedVersion: { type: integer, minimum: 1 }
      additionalProperties: false

    # ----- Theo dõi tập -----
    Exercise:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        sets: { type: [integer, 'null'], minimum: 1 }
        reps: { type: [integer, 'null'], minimum: 1 }
        weightKg: { type: [number, 'null'], minimum: 0 }
        durationMinutes: { type: [integer, 'null'], minimum: 1 }
        note: { type: [string, 'null'], maxLength: 300 }
      additionalProperties: false
    TrainingPlan:
      type: object
      required: [id, memberId, trainer, title, exercises, progressPercent, updatedAt]
      properties:
        id: { type: string, format: uuid }
        memberId: { type: string, format: uuid, description: '`members.id`' }
        trainer: { $ref: '#/components/schemas/TrainerRef' }
        title: { type: string }
        exercises: { type: array, items: { $ref: '#/components/schemas/Exercise' } }
        progressPercent: { type: integer, minimum: 0, maximum: 100 }
        updatedAt: { $ref: '#/components/schemas/DateTime' }
    CreateTrainingPlanRequest:
      type: object
      required: [title, exercises]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        exercises: { type: array, maxItems: 50, items: { $ref: '#/components/schemas/Exercise' } }
        progressPercent: { type: integer, minimum: 0, maximum: 100, default: 0 }
      additionalProperties: false
    UpdateTrainingPlanRequest:
      type: object
      minProperties: 1
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        exercises: { type: array, maxItems: 50, items: { $ref: '#/components/schemas/Exercise' } }
        progressPercent: { type: integer, minimum: 0, maximum: 100 }
      additionalProperties: false
    TrainingNote:
      type: object
      required: [id, memberId, trainer, plan, content, progressPercent, createdAt]
      properties:
        id: { type: string, format: uuid }
        memberId: { type: string, format: uuid, description: '`members.id`' }
        trainer: { $ref: '#/components/schemas/TrainerRef' }
        plan:
          description: Kế hoạch được gắn; `null` nếu ghi chú chung.
          oneOf:
            - type: object
              required: [id, title]
              properties:
                id: { type: string, format: uuid }
                title: { type: string }
            - type: 'null'
        content: { type: string }
        progressPercent: { type: [integer, 'null'], minimum: 0, maximum: 100 }
        createdAt: { $ref: '#/components/schemas/DateTime' }
    CreateTrainingNoteRequest:
      type: object
      required: [content]
      properties:
        content: { type: string, minLength: 1, maxLength: 2000 }
        planId: { type: [string, 'null'], format: uuid }
        progressPercent: { type: [integer, 'null'], minimum: 0, maximum: 100 }
      additionalProperties: false

    # ----- Tài khoản -----
    User:
      type: object
      required: [id, fullName, phone, email, dob, avatarUrl, role, status, shift, trainer, createdAt]
      properties:
        id: { type: string, format: uuid }
        fullName: { type: string }
        phone: { $ref: '#/components/schemas/Phone' }
        email: { type: [string, 'null'], format: email }
        dob:
          oneOf:
            - $ref: '#/components/schemas/DateOnly'
            - type: 'null'
        avatarUrl: { type: [string, 'null'] }
        role: { $ref: '#/components/schemas/Role' }
        status: { $ref: '#/components/schemas/UserStatus' }
        shift: { type: [string, 'null'], description: 'Ca làm, chỉ STAFF.' }
        trainer:
          description: Hồ sơ PT, chỉ TRAINER có.
          oneOf:
            - $ref: '#/components/schemas/TrainerProfile'
            - type: 'null'
        createdAt: { $ref: '#/components/schemas/DateTime' }
    CreateUserRequest:
      type: object
      required: [role, fullName, phone, password]
      properties:
        role:
          type: string
          enum: [STAFF, TRAINER]
        fullName: { type: string, minLength: 1, maxLength: 100 }
        phone: { $ref: '#/components/schemas/Phone' }
        email: { type: [string, 'null'], format: email, maxLength: 255 }
        dob:
          oneOf:
            - $ref: '#/components/schemas/DateOnly'
            - type: 'null'
        password: { $ref: '#/components/schemas/Password' }
        shift: { type: [string, 'null'], maxLength: 50, description: Chỉ STAFF. }
        trainer:
          type: object
          description: Chỉ TRAINER; bắt buộc khi role = TRAINER.
          properties:
            specialties: { type: array, items: { type: string, maxLength: 50 }, maxItems: 10, default: [] }
            bio: { type: [string, 'null'], maxLength: 1000 }
            experienceYears: { type: [integer, 'null'], minimum: 0, maximum: 60 }
          additionalProperties: false
      additionalProperties: false
    UpdateUserRequest:
      type: object
      minProperties: 1
      properties:
        fullName: { type: string, minLength: 1, maxLength: 100 }
        phone: { $ref: '#/components/schemas/Phone' }
        email: { type: [string, 'null'], format: email, maxLength: 255 }
        dob:
          oneOf:
            - $ref: '#/components/schemas/DateOnly'
            - type: 'null'
        shift: { type: [string, 'null'], maxLength: 50 }
      additionalProperties: false
    UpdateUserStatusRequest:
      type: object
      required: [status, reason]
      properties:
        status: { $ref: '#/components/schemas/UserStatus' }
        reason: { type: string, minLength: 1, maxLength: 500 }
      additionalProperties: false
    UpdateUserRoleRequest:
      type: object
      required: [role, reason]
      properties:
        role:
          type: string
          enum: [ADMIN, STAFF, TRAINER]
        reason: { type: string, minLength: 1, maxLength: 500 }
      additionalProperties: false

    # ----- Lớp học -----
    GymClass:
      type: object
      description: Một buổi lớp (tên schema tránh từ khóa `class`).
      required: [id, name, description, trainer, capacity, enrolledCount, availableSlots, startsAt, endsAt, cancelBeforeMinutes, cancelDeadline, status, myEnrollment]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: [string, 'null'] }
        trainer: { $ref: '#/components/schemas/TrainerRef' }
        capacity: { type: integer, minimum: 1 }
        enrolledCount: { type: integer, minimum: 0, description: Số đăng ký REGISTERED. }
        availableSlots: { type: integer, minimum: 0, description: capacity − enrolledCount. }
        startsAt: { $ref: '#/components/schemas/DateTime' }
        endsAt: { $ref: '#/components/schemas/DateTime' }
        cancelBeforeMinutes: { type: integer, minimum: 0 }
        cancelDeadline:
          $ref: '#/components/schemas/DateTime'
          description: Hạn hủy đăng ký = startsAt − cancelBeforeMinutes (BE tính).
        status: { $ref: '#/components/schemas/ClassStatus' }
        myEnrollment:
          description: Đăng ký REGISTERED của hội viên đang đăng nhập; `null` nếu chưa đăng ký hoặc không phải MEMBER.
          oneOf:
            - type: object
              required: [id, createdAt]
              properties:
                id: { type: string, format: uuid }
                createdAt: { $ref: '#/components/schemas/DateTime' }
            - type: 'null'
    CreateClassRequest:
      type: object
      required: [name, trainerId, capacity, startsAt, endsAt]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: [string, 'null'], maxLength: 2000 }
        trainerId: { type: string, format: uuid, description: '`trainers.id`' }
        capacity: { type: integer, minimum: 1, maximum: 200 }
        startsAt: { $ref: '#/components/schemas/DateTime' }
        endsAt: { $ref: '#/components/schemas/DateTime' }
        cancelBeforeMinutes: { type: integer, minimum: 0, maximum: 1440, default: 120 }
      additionalProperties: false
    UpdateClassRequest:
      type: object
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: [string, 'null'], maxLength: 2000 }
        trainerId: { type: string, format: uuid }
        capacity: { type: integer, minimum: 1, maximum: 200 }
        startsAt: { $ref: '#/components/schemas/DateTime' }
        endsAt: { $ref: '#/components/schemas/DateTime' }
        cancelBeforeMinutes: { type: integer, minimum: 0, maximum: 1440 }
        status:
          type: string
          enum: [CANCELLED]
          description: Chỉ dùng để hủy lớp.
      additionalProperties: false
    ClassEnrollment:
      type: object
      required: [id, classId, member, status, createdAt, cancelledAt]
      properties:
        id: { type: string, format: uuid }
        classId: { type: string, format: uuid }
        member: { $ref: '#/components/schemas/MemberRef' }
        status: { $ref: '#/components/schemas/EnrollmentStatus' }
        createdAt: { $ref: '#/components/schemas/DateTime' }
        cancelledAt:
          oneOf:
            - $ref: '#/components/schemas/DateTime'
            - type: 'null'

    # ----- Báo cáo -----
    ReportOverview:
      type: object
      required: [from, to, totalMembers, newMembers, expiringSoon, checkIns, popularPackages]
      properties:
        from: { $ref: '#/components/schemas/DateOnly' }
        to: { $ref: '#/components/schemas/DateOnly' }
        totalMembers: { type: integer, minimum: 0, description: Số hội viên có gói ACTIVE hôm nay. }
        newMembers: { type: integer, minimum: 0, description: Số hội viên mới trong khoảng (định nghĩa chờ Q20). }
        expiringSoon: { type: integer, minimum: 0, description: Số gói ACTIVE hết hạn trong 7 ngày tới. }
        checkIns: { type: integer, minimum: 0, description: Số lượt check-in trong khoảng. }
        popularPackages:
          type: array
          maxItems: 5
          items: { $ref: '#/components/schemas/PackageSales' }
    PackageSales:
      type: object
      required: [package, paidOrders, revenue]
      properties:
        package: { $ref: '#/components/schemas/PackageRef' }
        paidOrders: { type: integer, minimum: 0 }
        revenue: { $ref: '#/components/schemas/Money' }
    RevenueReport:
      type: object
      required: [from, to, groupBy, totalAmount, paymentCount, series, byPackage]
      properties:
        from: { $ref: '#/components/schemas/DateOnly' }
        to: { $ref: '#/components/schemas/DateOnly' }
        groupBy: { $ref: '#/components/schemas/ReportGroupBy' }
        totalAmount: { $ref: '#/components/schemas/Money' }
        paymentCount: { type: integer, minimum: 0 }
        series:
          type: array
          items:
            type: object
            required: [period, amount, paymentCount]
            properties:
              period: { type: string, description: '`YYYY-MM-DD`, `YYYY-MM` hoặc `YYYY` theo `groupBy`.' }
              amount: { $ref: '#/components/schemas/Money' }
              paymentCount: { type: integer, minimum: 0 }
        byPackage:
          type: array
          description: Doanh thu theo gói, nhiều nhất trước.
          items:
            type: object
            required: [package, amount, paymentCount]
            properties:
              package: { $ref: '#/components/schemas/PackageRef' }
              amount: { $ref: '#/components/schemas/Money' }
              paymentCount: { type: integer, minimum: 0 }

    # ----- Thông báo -----
    Notification:
      type: object
      required: [id, type, title, body, targetType, targetId, isRead, createdAt]
      properties:
        id: { type: string, format: uuid }
        type:
          type: string
          description: |
            Loại thông báo, ví dụ `PAYMENT_SUCCESS`, `PAYMENT_FAILED`, `SUBSCRIPTION_EXPIRING`, `BROADCAST`.
            Danh sách đủ chốt khi làm module thông báo (Hồng Anh). FE hiển thị `title`, `body`; chỉ dùng `type` để chọn biểu tượng.
        title: { type: string }
        body: { type: string }
        targetType:
          type: [string, 'null']
          description: Loại đối tượng liên quan để FE mở màn, ví dụ `ORDER`, `SUBSCRIPTION`, `APPOINTMENT`, `CLASS`.
        targetId: { type: [string, 'null'], format: uuid }
        isRead: { type: boolean }
        createdAt: { $ref: '#/components/schemas/DateTime' }
    NotificationPageMeta:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [unreadCount]
          properties:
            unreadCount: { type: integer, minimum: 0, description: Tổng số thông báo chưa đọc của tôi. }
    BroadcastRequest:
      type: object
      required: [title, body, roles]
      properties:
        title: { type: string, minLength: 1, maxLength: 100 }
        body: { type: string, minLength: 1, maxLength: 1000 }
        roles:
          type: array
          minItems: 1
          uniqueItems: true
          items: { $ref: '#/components/schemas/Role' }
      additionalProperties: false
    BroadcastResponse:
      type: object
      required: [recipientCount]
      properties:
        recipientCount: { type: integer, minimum: 0 }

    # ----- Tham chiếu rút gọn (nhúng trong object khác) -----
    UserRef:
      type: object
      required: [id, fullName]
      properties:
        id: { type: string, format: uuid, description: '`users.id`' }
        fullName: { type: string }
    MemberRef:
      type: object
      required: [id, memberCode, fullName, phone, avatarUrl]
      properties:
        id: { type: string, format: uuid, description: '`members.id`' }
        memberCode: { type: string }
        fullName: { type: string }
        phone: { $ref: '#/components/schemas/Phone' }
        avatarUrl: { type: [string, 'null'] }
    TrainerRef:
      type: object
      required: [id, fullName, avatarUrl]
      properties:
        id: { type: string, format: uuid, description: '`trainers.id`' }
        fullName: { type: string }
        avatarUrl: { type: [string, 'null'] }
    PackageRef:
      type: object
      required: [id, name, type]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, description: Tên gói hiện tại. }
        type: { $ref: '#/components/schemas/PackageType' }
    SubscriptionRef:
      type: object
      required: [id, packageName, endsOn, daysLeft]
      properties:
        id: { type: string, format: uuid }
        packageName: { type: string }
        endsOn: { $ref: '#/components/schemas/DateOnly' }
        daysLeft: { type: integer, minimum: 0, description: 'Số ngày còn lại, tính cả hôm nay.' }
    CheckInRef:
      type: object
      required: [id, checkedInAt]
      properties:
        id: { type: string, format: uuid }
        checkedInAt: { $ref: '#/components/schemas/DateTime' }

