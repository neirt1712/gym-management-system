# CI: chạy đúng các bước "Cách kiểm tra" trong PULL_REQUEST_TEMPLATE và CONTRIBUTING.md (lint, typecheck, test, build).
# Chỉ kiểm tra code, không deploy (Q23: nhóm chỉ chạy local).
name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

# Push liên tiếp lên cùng nhánh thì hủy lượt chạy cũ cho đỡ chờ
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend

    # Postgres giống docker-compose.yml; image chính thức có sẵn btree_gist, unaccent, pg_trgm
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gym
          POSTGRES_PASSWORD: gym
          POSTGRES_DB: gym_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gym -d gym_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Test e2e xóa sạch dữ liệu nên chỉ chạy trên DB tên *_test
      DATABASE_URL: postgresql://gym:gym@localhost:5432/gym_test?schema=public
      TEST_DATABASE_URL: postgresql://gym:gym@localhost:5432/gym_test?schema=public

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Cài thư viện
        run: npm ci

      - name: Tạo bảng
        run: npx prisma migrate deploy

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit test
        run: npm run test

      - name: E2E test
        run: npm run test:e2e

      - name: Build
        run: npm run build

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Cài thư viện
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
