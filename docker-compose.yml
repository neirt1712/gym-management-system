version: '3.8'

services:
  # 1. Dịch vụ Database PostgreSQL
  postgres-db:
    image: postgres:15-alpine
    container_name: gym_postgres_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - gym_network

  # 2. Dịch vụ pgAdmin (Giao diện xem Database trên Web)
  pgadmin:
    image: dpage/pgadmin4
    container_name: gym_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "5050:80"
    depends_on:
      - postgres-db
    networks:
      - gym_network

# Định nghĩa Volume để dữ liệu không bị mất khi tắt Docker
volumes:
  postgres_data:

# Định nghĩa Network để các container giao tiếp với nhau
networks:
  gym_network:
    driver: bridge